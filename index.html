<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des Primes 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--brd:#e2e8f0;--tx:#1e293b;--tx2:#64748b;--tx3:#94a3b8;--acc:#3b82f6;--grn:#16a34a;--red:#dc2626;--org:#ea580c;--blu:#2563eb;--vol:#7c3aed;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}
.container{max-width:1400px;margin:0 auto;padding:16px;}
button{cursor:pointer;}input,select{outline:none;font-family:inherit;}

.login-screen{display:flex;align-items:center;justify-content:center;min-height:90vh;}
.login-box{background:var(--card);border-radius:24px;padding:48px;text-align:center;max-width:420px;width:100%;box-shadow:0 4px 24px #0001;}
.login-box h1{font-size:24px;font-weight:800;margin-bottom:4px;}
.login-box p{color:var(--tx2);font-size:12px;margin-bottom:24px;}
.login-input{width:100%;padding:12px 16px;border:2px solid var(--brd);border-radius:12px;font-size:14px;margin-bottom:12px;text-align:center;}
.login-input:focus{border-color:var(--acc);}
.login-btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--tx);color:#fff;font-size:14px;font-weight:700;margin-bottom:16px;}
.login-btn:hover{background:#334155;}.login-btn:disabled{opacity:.5;cursor:wait;}
.login-error{color:var(--red);font-size:12px;margin-bottom:8px;}
.login-setup{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px;text-align:left;font-size:11px;color:#92400e;line-height:1.6;margin-top:12px;}
.login-setup strong{display:block;margin-bottom:4px;}
.login-setup input{width:100%;padding:6px 10px;border:1px solid #fde68a;border-radius:6px;font-size:11px;margin-top:6px;}

.header{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:18px;padding:18px 24px;margin-bottom:16px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.header h1{font-size:20px;font-weight:800;letter-spacing:-.5px;}
.header-sub{font-size:10px;opacity:.5;margin-top:2px;}
.hdr-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.hdr-stat{background:#ffffff12;border-radius:10px;padding:6px 14px;text-align:center;}
.hdr-stat small{font-size:8px;opacity:.4;text-transform:uppercase;letter-spacing:1px;display:block;}
.hdr-stat b{font-size:14px;}
.btn{padding:8px 16px;border-radius:8px;font-size:11px;font-weight:700;border:none;}
.btn-grn{background:#10b981;color:#fff;}.btn-grn:hover{background:#059669;}
.btn-ghost{background:none;border:1px solid #ffffff33;color:#fff;opacity:.7;font-weight:600;}.btn-ghost:hover{opacity:1;}
.btn-sm{padding:5px 11px;font-size:10px;border-radius:6px;}
.btn-danger{background:none;border:1px solid #fca5a5;color:var(--red);font-weight:600;}
.btn-parti{background:none;border:1px solid #fed7aa;color:#c2410c;font-weight:600;font-size:10px;padding:4px 10px;border-radius:6px;}
.btn-parti:hover{background:#fff7ed;}
.btn-revenir{background:none;border:1px solid #bbf7d0;color:#15803d;font-weight:600;font-size:10px;padding:4px 10px;border-radius:6px;}
.btn-revenir:hover{background:#f0fdf4;}

.warn{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 16px;margin-bottom:12px;font-size:11px;color:#92400e;display:flex;align-items:center;gap:8px;}
.loading{text-align:center;padding:60px;color:var(--tx3);}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}

.nav-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
.tab{padding:8px 16px;border-radius:10px;border:none;background:var(--card);color:var(--tx2);font-weight:700;font-size:11px;transition:all .15s;}
.tab.on{background:var(--tx);color:#fff;box-shadow:0 3px 10px #1e293b44;}
.tab.vol-on{background:var(--vol);color:#fff;box-shadow:0 3px 10px #7c3aed44;}

.cfg{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--brd);}
.cfg-title{font-weight:800;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.cfg-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;}
.plr{background:#f8fafc;border:1px solid var(--brd);border-radius:10px;padding:10px 14px;flex:1;min-width:180px;position:relative;}
.plr-label{font-size:9px;color:var(--tx3);font-weight:700;text-transform:uppercase;margin-bottom:6px;}
.plr-r{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.plr-r label{font-size:10px;color:var(--tx3);width:44px;flex-shrink:0;}
.plr-r input{width:52px;padding:4px;border:1px solid var(--brd);border-radius:6px;font-size:12px;text-align:center;font-weight:700;}
.plr-r select{padding:4px 6px;border:1px solid var(--brd);border-radius:6px;font-size:11px;font-weight:600;background:#fff;color:var(--tx);flex:1;}
.plr-r span{font-size:11px;color:var(--tx3);}
.plr-del{position:absolute;top:4px;right:6px;background:none;border:none;color:var(--tx3);font-size:16px;}
.plr-add{background:#f8fafc;border:2px dashed var(--brd);border-radius:10px;padding:12px 10px;color:var(--tx3);font-size:18px;min-width:50px;display:flex;align-items:center;justify-content:center;align-self:stretch;}
.plr-add:hover{border-color:var(--acc);color:var(--acc);}
.aug{display:flex;align-items:center;gap:6px;}
.aug label{font-size:11px;color:var(--tx2);}
.aug input{width:50px;padding:4px 6px;border:1px solid var(--brd);border-radius:6px;font-size:12px;text-align:center;font-weight:700;}

.mgr-row{display:flex;align-items:center;gap:8px;}
.mgr-row label{font-size:11px;color:var(--tx2);font-weight:700;white-space:nowrap;}
.mgr-input{padding:7px 12px;border:1px solid var(--brd);border-radius:8px;font-size:12px;font-weight:600;width:210px;}
.mgr-input:focus{border-color:var(--acc);}

.formule-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px 16px;margin-bottom:12px;}
.formule-title{font-weight:700;font-size:12px;color:#0369a1;margin-bottom:8px;}
.formule-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.formule-row label{font-size:11px;color:#0369a1;}
.formule-row input{width:50px;padding:4px;border:1px solid #bae6fd;border-radius:6px;font-size:12px;text-align:center;font-weight:700;}

.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.st{border-radius:12px;padding:10px 16px;flex:1;min-width:90px;}
.st-dark{background:var(--tx);color:#fff;}
.st small{font-size:9px;text-transform:uppercase;opacity:.5;display:block;}
.st b{font-size:18px;font-weight:800;display:block;}
.st span{font-size:10px;opacity:.5;}

.mbar{display:flex;gap:3px;margin-bottom:12px;flex-wrap:wrap;}
.mt{padding:5px 9px;border-radius:7px;border:none;font-size:10px;font-weight:600;background:var(--card);color:var(--tx3);}
.mt.on{background:var(--tx);color:#fff;}

.mag{background:var(--card);border-radius:14px;margin-bottom:10px;border:1px solid var(--brd);overflow:hidden;}
.mag-h{padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.mag-name{font-weight:800;font-size:14px;}
.mag-sub{font-size:10px;color:var(--tx3);}
.vend{padding:10px 16px;border-bottom:1px solid #f8fafc;}
.vend.parti-vend{opacity:.55;background:#fff8f8;}
.vend-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.vend-name{font-weight:700;font-size:12px;}
.vend-total{font-size:11px;font-weight:800;background:#f1f5f9;padding:2px 10px;border-radius:20px;}
.vend-menu{position:relative;display:inline-block;}
.vend-menu-btn{background:none;border:1px solid var(--brd);border-radius:6px;padding:3px 8px;font-size:14px;cursor:pointer;color:var(--tx2);line-height:1;}
.vend-menu-btn:hover{background:#f1f5f9;}
.vend-menu-dropdown{display:none;position:absolute;right:0;top:100%;margin-top:3px;background:#fff;border:1px solid var(--brd);border-radius:8px;box-shadow:0 4px 12px #0001;z-index:100;min-width:140px;overflow:hidden;}
.vend-menu-dropdown.open{display:block;}
.vend-menu-item{display:block;width:100%;text-align:left;padding:8px 14px;font-size:11px;font-weight:600;background:none;border:none;cursor:pointer;color:var(--tx2);white-space:nowrap;}
.vend-menu-item:hover{background:#f8fafc;}
.vend-menu-item.danger{color:var(--red);}
.vend-menu-item.danger:hover{background:#fff5f5;}
.mgrid{display:flex;gap:4px;flex-wrap:wrap;}
.mc{border-radius:8px;padding:6px;border:1px solid var(--brd);min-width:68px;flex:1;}
.mc.wide{min-width:200px;flex:0 0 200px;}
.mc-lbl{font-size:9px;color:var(--tx3);font-weight:700;margin-bottom:2px;}
.mc-obj{font-size:9px;color:var(--tx3);}
.mc input{width:100%;padding:3px 4px;border:1px solid var(--brd);border-radius:5px;font-size:11px;font-weight:600;margin-top:2px;}
.mc-res{margin-top:2px;display:flex;justify-content:space-between;font-size:10px;font-weight:700;}
.mc.bg-g{background:#f0fdf4;}.mc.bg-b{background:#eff6ff;}.mc.bg-o{background:#fff7ed;}.mc.bg-r{background:#fef2f2;}
.tx-g{color:var(--grn);}.tx-b{color:var(--blu);}.tx-o{color:var(--org);}.tx-r{color:var(--red);}

.badge-fixe{background:#eff6ff;color:var(--blu);font-size:9px;font-weight:800;padding:1px 7px;border-radius:20px;border:1px solid #bfdbfe;}
.badge-vol{background:#f5f3ff;color:var(--vol);font-size:9px;font-weight:800;padding:1px 7px;border-radius:20px;border:1px solid #ddd6fe;}
.badge-alt{background:#dcfce7;color:#166534;font-size:9px;font-weight:800;padding:1px 7px;border-radius:20px;border:1px solid #86efac;}
.badge-parti{background:#fef2f2;color:var(--red);font-size:9px;font-weight:800;padding:1px 7px;border-radius:20px;border:1px solid #fca5a5;}
.vend-name-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

.vol-section{background:#faf5ff;border:1px solid #ddd6fe;border-radius:14px;padding:16px;margin-bottom:12px;}
.vol-section-hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.vol-section-title{font-weight:800;font-size:13px;color:var(--vol);}
.vol-section-desc{font-size:11px;color:#6d28d9;margin-bottom:12px;opacity:.7;}

.alt-section{background:#f0fdf4;border:1px solid #86efac;border-radius:14px;padding:16px;margin-bottom:12px;}
.alt-section-hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.alt-section-title{font-weight:800;font-size:13px;color:#166534;}
.alt-section-desc{font-size:11px;color:#15803d;margin-bottom:12px;opacity:.7;}
.vol-chips{display:flex;flex-wrap:wrap;margin-bottom:10px;}
.vol-chip{background:#fff;border-radius:8px;padding:6px 12px;font-size:11px;border:1px solid #ddd6fe;display:inline-flex;align-items:center;gap:6px;margin:3px;}
.vol-assign-tbl{background:#fff;border:1px solid #ddd6fe;border-radius:10px;overflow:hidden;margin-top:10px;}
.vol-assign-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f5f3ff;flex-wrap:wrap;}
.vol-assign-row:last-child{border-bottom:none;}
.vol-assign-mag{font-size:11px;font-weight:700;min-width:150px;}
.va-item{display:flex;align-items:center;gap:4px;font-size:10px;background:#f5f3ff;padding:3px 8px;border-radius:6px;}
.va-item input{width:34px;padding:2px 4px;border:1px solid #ddd6fe;border-radius:4px;font-size:10px;text-align:center;background:#fff;}

.p25-bar{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:14px;padding:16px;margin-bottom:12px;color:#fff;}
.p25-bar-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.4;margin-bottom:12px;}
.p25-cards{display:flex;gap:8px;flex-wrap:wrap;}
.p25-card{background:#ffffff12;border-radius:10px;padding:10px 16px;flex:1;min-width:110px;}
.p25-card small{font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:2px;}
.p25-card b{font-size:16px;font-weight:800;}
.p25-card sub{font-size:10px;opacity:.5;display:block;margin-top:2px;}
.p25-card-total{background:#3b82f620;border:1px solid #3b82f640;}

.list-panel{background:var(--card);border-radius:14px;margin-bottom:12px;border:1px solid var(--brd);overflow:hidden;}
.list-ph{padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.list-ph-title{font-weight:800;font-size:14px;}
.list-ph-sub{font-size:11px;color:var(--tx3);margin-top:2px;}
.search-wrap{position:relative;min-width:200px;flex:1;max-width:340px;}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--brd);border-radius:10px;font-size:12px;}
.search-wrap::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;}
.fbtn-row{display:flex;gap:4px;flex-wrap:wrap;}
.fbtn{padding:5px 12px;border-radius:7px;border:1px solid var(--brd);font-size:10px;font-weight:700;background:#f8fafc;color:var(--tx2);}
.fbtn.on{background:var(--tx);color:#fff;border-color:var(--tx);}
.fbtn.vol-on{background:var(--vol);color:#fff;border-color:var(--vol);}

.vrow{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #f1f5f9;transition:background .1s;gap:8px;}
.vrow:hover{background:#f8fafc;}
.vrow.parti-row{opacity:.6;background:#fff8f8;}
.vrow-left{display:flex;align-items:center;gap:10px;min-width:0;}
.vrow-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:var(--tx);color:#fff;}
.vrow-av.vol{background:var(--vol);}
.vrow-av.parti{background:#fca5a5;color:#7f1d1d;}
.vrow-info{line-height:1.5;min-width:0;}
.vrow-nom{font-weight:700;font-size:13px;}
.vrow-meta{font-size:10px;color:var(--tx3);}
.vrow-meta2{font-size:10px;color:var(--vol);margin-top:1px;}
.vrow-right{display:flex;align-items:center;gap:10px;flex-shrink:0;text-align:right;}
.list-empty{padding:40px;text-align:center;color:var(--tx3);font-size:13px;}

.mag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:16px;}
.mag-card{background:#f8fafc;border:1px solid var(--brd);border-radius:12px;padding:12px 14px;}
.mag-card-name{font-weight:800;font-size:13px;margin-bottom:3px;}
.mag-card-mgr{font-size:11px;color:var(--tx2);margin-bottom:8px;}
.mag-card-stats{display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--tx3);margin-bottom:8px;}
.mag-card-stat{background:#fff;border-radius:6px;padding:2px 8px;border:1px solid var(--brd);}
.mag-card-btns{display:flex;gap:6px;}

.rtbl{width:100%;border-collapse:collapse;}
.rtbl th{padding:8px 12px;text-align:left;font-size:10px;color:var(--tx2);background:#f8fafc;white-space:nowrap;}
.rtbl td{padding:8px 12px;font-size:12px;border-bottom:1px solid #f1f5f9;}
.rtbl .r{text-align:right;}
.rtbl tr:hover td{background:#f8fafc;}

/* GLOBAL SEARCH BAR */
.gsearch-bar{background:var(--card);border-radius:14px;padding:10px 16px;margin-bottom:12px;border:1px solid var(--brd);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.gsearch-input{flex:1;min-width:220px;padding:9px 14px 9px 36px;border:2px solid var(--brd);border-radius:10px;font-size:13px;font-family:inherit;transition:border-color .15s;}
.gsearch-input:focus{border-color:var(--acc);outline:none;}
.gsearch-wrap{position:relative;flex:1;min-width:220px;}
.gsearch-wrap::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
.gsearch-hits{font-size:11px;color:var(--tx3);}
.gsearch-hit{background:#fef9c3;border-radius:2px;font-weight:700;color:#92400e;}
.gsearch-clear{padding:6px 12px;border-radius:8px;border:1px solid var(--brd);background:#f8fafc;color:var(--tx2);font-size:11px;font-weight:700;}
.gsearch-clear:hover{background:#f1f5f9;}
.gsearch-result{padding:7px 10px;border-radius:8px;background:#f8fafc;border:1px solid var(--brd);font-size:12px;font-weight:600;cursor:pointer;transition:background .1s;}
.gsearch-result:hover{background:#eff6ff;border-color:#bfdbfe;}

/* RH SOCIETY TABS */
.rh-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;}
.rh-tab{padding:7px 16px;border-radius:10px;border:none;background:var(--card);color:var(--tx2);font-weight:700;font-size:11px;transition:all .15s;border:1px solid var(--brd);}
.rh-tab.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 10px #3b82f644;}
.rh-tab.all-on{background:var(--tx);color:#fff;border-color:var(--tx);}

.footer{text-align:center;padding:16px;font-size:10px;color:var(--tx3);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--tx);color:#fff;padding:10px 20px;border-radius:10px;font-size:12px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

.modal-bg{position:fixed;inset:0;background:#00000055;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:var(--card);border-radius:16px;padding:24px;max-width:500px;width:100%;box-shadow:0 8px 40px #0004;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:16px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--tx2);margin-bottom:16px;}
.modal label{font-size:11px;font-weight:700;color:var(--tx2);display:block;margin-bottom:4px;margin-top:8px;}
.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--brd);border-radius:8px;font-size:13px;font-family:inherit;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
</style>
</head>
<body>
<div id="app" class="container"></div>
<div id="toast" class="toast"></div>
<script>
let API_URL=localStorage.getItem('primes_api_url')||'';
const M=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MS=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const SAISON=[.083,.078,.086,.086,.085,.084,.092,.091,.082,.086,.079,.089];
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('fr-FR');
const fmtE=n=>n==null?'—':fmt(n)+' €';
const fmtPrime=n=>n==null?'—':parseFloat(n.toFixed(2)).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fmtDate=d=>{if(!d)return'';const dt=new Date(d);if(isNaN(dt))return String(d);const j=String(dt.getDate()).padStart(2,'0');const m=String(dt.getMonth()+1).padStart(2,'0');const y=dt.getFullYear();return`${j}/${m}/${y}`;};
const extractYearMonth=d=>{if(!d)return null;const dt=new Date(d);if(isNaN(dt))return null;return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;};
const calcObj=(ca,aug,m)=>Math.round(ca*(1+(aug/100))*SAISON[m]);
// Récupérer la formule pour un mois donné (gère l'ancien et nouveau format)
function getFormuleMois(comp,year,mois,mag=null){
  // Override par magasin en priorité
  if(mag&&mag.formules&&mag.formules[year]){
    const mf=Array.isArray(mag.formules[year])?mag.formules[year][mois]:mag.formules[year];
    if(mf)return mf;
  }
  const defAug=comp.augmentation??2;const defY1=comp.poidsY1??70;const defM1=comp.poidsM1??30;
  if(!comp.formules || !comp.formules[year]) return {poidsY1:defY1,poidsM1:defM1,augmentation:defAug};
  const formule=comp.formules[year];
  if(Array.isArray(formule)){

const OPS=[{val:'>=',label:'≥ supérieur ou égal',short:'≥'},{val:'<=',label:'≤ inférieur ou égal',short:'≤'},{val:'>',label:'> strictement supérieur',short:'>'},{val:'<',label:'< strictement inférieur',short:'<'}];

function calcPrime(t,pal){
  if(t==null)return 0;let r=0;
  const s=[...pal].sort((a,b)=>b.seuil-a.seuil);
  for(const x of s){const op=x.operateur||'>=';let ok=false;
    if(op==='>=')ok=t>=x.seuil;else if(op==='<=')ok=t<=x.seuil;else if(op==='>')ok=t>x.seuil;else ok=t<x.seuil;
    if(ok){r=x.prime;break;}}return r;}

// Obtenir les paliers pour un mois (avec fallback aux paliers globaux)
function getPaliersMois(comp,mois){
  if(mois!==undefined && mois!==null && comp.paliersMois && comp.paliersMois[mois]){
    return comp.paliersMois[mois];
  }
  return comp.paliers||[];
}

// Obtenir le nom du vendeur pour un mois donné (gère les remplacements)
function getVendeurName(v,mois,year){
  if(!v.remplacements||v.remplacements.length===0)return v.nom;
  const currentDate=new Date(year,mois,1);
  for(let i=v.remplacements.length-1;i>=0;i--){
    const [y,m,d]=v.remplacements[i].dateRemplacement.split('-').map(Number);
    const replDate=new Date(y,m-1,d);
    if(currentDate>=replDate)return v.remplacements[i].nomRemplacant;
  }
  return v.nom;
}

function tc(t){if(t==null)return'';if(t>=110)return'g';if(t>=100)return'b';if(t>=95)return'o';return'r';}
function tcMois(t,paliers){
  if(t==null)return'';
  if(!paliers||paliers.length===0)return tc(t);
  const s=[...paliers].sort((a,b)=>b.seuil-a.seuil);
  for(let i=0;i<s.length;i++){
    const x=s[i];const op=x.operateur||'>=';let ok=false;
    if(op==='>=')ok=t>=x.seuil;else if(op==='<=')ok=t<=x.seuil;else if(op==='>')ok=t>x.seuil;else ok=t<x.seuil;
    if(ok){
      const colors=['g','b','o','r'];
      return colors[Math.min(i,3)];
    }
  }
  return'r';
}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function ini(n){return(n||'').split(' ').map(w=>w[0]||'').join('').substring(0,2).toUpperCase()||'?';}

// Filtrer les magasins système
const isSystemMagasin = (magNom) => ['Anciens vendeurs', '__partis__', 'Non assignés', 'Autre', 'Non assigné'].includes(magNom);
const filterNormalMagasins = (magasins) => {
  const mois=parseInt(S.mois)||0;
  const year=S.selectedYear||2025;
  return magasins.filter(m => {
    if(isSystemMagasin(m.nom))return false;
    if(m.nom.includes('/'))return false;
    if(!m.dateFermeture)return true;
    const [yearFerm,monthFerm,dayFerm]=(m.dateFermeture.split('-')||[]).map(Number);
    if(!yearFerm||!monthFerm)return true;

    // Si on est avant l'année de fermeture, afficher le magasin
    if(year<yearFerm)return true;
    // Si on est après l'année de fermeture, NE PAS afficher
    if(year>yearFerm)return false;
    // Si on est dans l'année de fermeture, vérifier le mois (ou afficher tout si mode annuel)
    if(year===yearFerm){
      if(S.mois==='all')return true; // Mode annuel: afficher si l'année correspond
      const currentDate=new Date(year,mois,1).getTime();
      const fermetureDate=new Date(yearFerm,monthFerm-1,dayFerm||1).getTime();
      return currentDate<fermetureDate;
    }
    return false;
  });
};

// ═══ Helper : vérifie si un élément (vendeur/volant/alternant) est actif au mois sélectionné ═══
function isActiveInMonth(dateParti, selectedYear, moisStr) {
  if(!dateParti) return true;
  const dateNormalized = extractYearMonth(dateParti) || dateParti;
  const [yearParti, moisParti] = dateNormalized.split('-').map(Number);

  // Avant l'année de départ/fermeture: actif
  if(selectedYear < yearParti) return true;
  // Après l'année de départ/fermeture: inactif
  if(selectedYear > yearParti) return false;

  // Même année: vérifier le mois
  if(moisStr === 'all') return true; // Mode annuel: afficher si l'année correspond

  const moisActuel = parseInt(moisStr);
  return moisActuel + 1 < moisParti; // visible jusqu'AU mois de départ (exclu)
}

function getCurrentCalendarContext(){
  const now=new Date();
  return{year:now.getFullYear(),month:now.getMonth()};
}

function isResultMonthAllowed(year,mois){
  const targetYear=Number(year);
  const targetMonth=Number(mois);
  const current=getCurrentCalendarContext();
  if(targetYear<current.year)return true;
  if(targetYear>current.year)return false;
  return targetMonth<=current.month;
}

function getResultMonths(year,selectedMois=null){
  if(selectedMois!==null&&selectedMois!==undefined){
    return isResultMonthAllowed(year,selectedMois)?[selectedMois]:[];
  }
  return [...Array(12).keys()].filter(m=>isResultMonthAllowed(year,m));
}

function applyYearInputData(payload){
  if(!S.data?.companies)return;
  S.volantJours=(payload.volantJours||[]).map(x=>({...x}));
  S.volantAbsences=(payload.volantAbsences||[]).map(x=>({...x}));
  S.alternantJours=(payload.alternantJours||[]).map(x=>({...x}));
  S.alternantEcole=(payload.alternantEcole||[]).map(x=>({...x}));
  S.alternantAbsences=(payload.alternantAbsences||[]).map(x=>({...x}));

  const vendeurIndex={};
  const alternantIndex={};
  for(const[cn,comp]of Object.entries(S.data.companies)){
    alternantIndex[cn]={};
    for(const mag of comp.magasins||[]){
      for(const v of mag.vendeurs||[]){
        vendeurIndex[`${cn}|||${mag.nom}|||${v.nom}`]=v;
      }
    }
    for(const alt of comp.alternants||[]){
      alt.joursEcole={};
      alt.joursEntreprise={};
      alternantIndex[cn][alt.nom]=alt;
    }
  }

  for(const row of(payload.caManuels||[])){
    const v=vendeurIndex[`${row.societe}|||${row.magasin}|||${row.vendeur}`];
    if(!v)continue;
    v.caSaisie[row.mois]=row.ca;
  }
  for(const row of(payload.objectifsManuels||[])){
    const v=vendeurIndex[`${row.societe}|||${row.magasin}|||${row.vendeur}`];
    if(!v)continue;
    v.objManuel[row.mois]=row.objectif;
  }
  for(const row of(payload.alternantEcole||[])){
    const alt=alternantIndex[row.societe]?.[row.alternant];
    if(!alt)continue;
    alt.joursEcole[row.mois]=row.jours;
  }
  for(const row of(payload.alternantJours||[])){
    const alt=alternantIndex[row.societe]?.[row.alternant];
    if(!alt)continue;
    alt.joursEntreprise[row.mois]=(alt.joursEntreprise[row.mois]||0)+(row.jours||0);
  }
}

  const res=await fetch(url.toString(), { cache: 'no-store' });const json=await res.json();
  if(json.error)throw new Error(json.error);return json;}

// Optimistic Update Helper - mise à jour immédiate + sauvegarde arrière-plan
async function optimisticUpdate(updateFn, saveFn, successMsg='Sauvegardé') {
  updateFn();render();
  const retry=async(attempt=0)=>{
    try{
      await saveFn();
      // NE PAS recharger toutes les données - elles sont déjà à jour localement
      // Juste afficher le succès. L'auto-refresh mettra à jour si nécessaire.
      render();
      toast('✅ '+successMsg);
    }
    catch(e){
      if(attempt<3){setTimeout(()=>retry(attempt+1),2000);if(attempt===0)toast('⚠️ Erreur, nouvelle tentative...');}
      else toast('❌ Erreur : '+e.message);
    }
  };retry();
}

function renderTotals2025Banner(){
  const comps=S.data.companies;
  const year=S.selectedYear||2025;
  const resultMonths=getResultMonths(year);
  let totalGeneral=0;let totalSimule2026=0;let totalReel2026=0;
  let cards='';

  for(const[cn,comp]of Object.entries(comps)){
    let totalYear=0;let totalSimule=0;let totalReel=0;

    // Vendeurs fixes
    for(const mag of comp.magasins){
      const ca25=mag.totalCA2025||100000;
      const nActifs=mag.vendeurs.filter(v=>isActiveInMonth(v.dateParti,S.selectedYear,S.mois)).length||1;
      for(const v of mag.vendeurs){
        if(v.parti)continue;
        let tp=0;let tpSimule=0;let tpReel=0;
        for(const m of resultMonths){
          const ca=v.caSaisie?.[m]??v.caSheetAuto?.[m];
          if(ca==null)continue;
          const formuleMois=getFormuleMois(comp,year,m,mag);
          const augm=formuleMois.augmentation??2;
          const obj=v.objManuel?.[m]??v.objSheetAuto?.[m]??calcObj(ca25,augm,m);
          const primeMag=calcPrime((ca/obj)*100,getPaliersMois(comp,m))*(v.tempsPartielMois?.[m]??100)/100;
          tp+=primeMag;
          if(year===2026){
            if(m<3)tpSimule+=primeMag;else tpReel+=primeMag;
          }
        }
        totalYear+=tp;
        if(year===2026){totalSimule+=tpSimule;totalReel+=tpReel;}
      }
    }

    // Vendeurs volants
    for(const vl of (comp.volants||[])){
      if(vl.parti)continue;
      let p=0;let pSimule=0;let pReel=0;
      for(const m of resultMonths){
        const pm=getVolantTotalPrimeMois(cn,comp,vl,m,year);
        p+=pm;
        if(year===2026){if(m<3)pSimule+=pm;else pReel+=pm;}
      }
      totalYear+=p;
      if(year===2026){totalSimule+=pSimule;totalReel+=pReel;}
    }

    // Alternants
    for(const alt of (comp.alternants||[])){
      if(alt.parti)continue;
      let p=0;let pSimule=0;let pReel=0;
      for(const m of resultMonths){
        const pm=getAlternantTotalPrimeMois(cn,comp,alt,m,year);
        p+=pm;
        if(year===2026){if(m<3)pSimule+=pm;else pReel+=pm;}
      }
      totalYear+=p;
      if(year===2026){totalSimule+=pSimule;totalReel+=pReel;}
    }

    if(year===2026){totalSimule2026+=totalSimule;totalReel2026+=totalReel;totalYear=totalSimule+totalReel;}
    totalGeneral+=totalYear;

    cards+=`<div style="background:#f5f3ff;border:2px solid #ddd6fe;border-radius:14px;padding:14px 20px;min-width:160px;text-align:center">
      <div style="font-size:10px;color:#7c3aed;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">${cn}</div>
      <div style="font-size:22px;font-weight:800;color:#6d28d9">${year===2026?fmtE(totalReel):fmtE(totalYear)}</div>
      ${year===2026?`<div style="font-size:9px;color:#7c3aed;margin-top:6px">📊 Simulé: ${fmtE(totalSimule)} | Réel: ${fmtE(totalReel)}</div>`:''}
    </div>`;
  }

  return`<div style="background:linear-gradient(135deg,#7c3aed,#a78bfa);border-radius:16px;padding:18px 24px;margin-bottom:16px;box-shadow:0 4px 12px #7c3aed22">
    <div style="color:#fff;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:2px;opacity:.8;margin-bottom:12px">📊 TOTAL PRIMES ${year} PAR SOCIÉTÉ${year===2026?' (Système à partir d\'avril)':''}</div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between">
      <div style="display:flex;gap:12px;flex-wrap:wrap">${cards}</div>
      <div style="background:#faf5ff;border:3px solid #fff;border-radius:14px;padding:14px 24px;text-align:center;min-width:180px">
        <div style="font-size:10px;color:#7c3aed;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">🏆 TOTAL GÉNÉRAL</div>
        <div style="font-size:26px;font-weight:800;color:#6d28d9">${year===2026?fmtE(totalReel2026):fmtE(totalGeneral)}</div>
        ${year===2026?`<div style="font-size:9px;color:#7c3aed;margin-top:8px;border-top:1px solid #e9d5ff;padding-top:6px">📊 Simulé: ${fmtE(totalSimule2026)}<br/>Réel: ${fmtE(totalReel2026)}</div>`:''}
      </div>

                if(!evolN1)return`<div style="font-size:10px;color:#94a3b8;font-style:italic">Évolution N-1 : données ${year-1} non disponibles</div>`;
                // évolution stockée en % (ex: 103.0), on divise par 100 pour avoir le ratio
                const evol=evolN1[moisSel]!=null?(evolN1[moisSel]/100).toFixed(4):null;
                return evol!=null
                  ?`<div style="font-size:10px;color:#0369a1">Évol. N-1 — ${MS[moisSel]} : <b>${evol}</b></div>`
                  :`<div style="font-size:10px;color:#94a3b8;font-style:italic">Évolution N-1 : non disponible pour ${MS[moisSel]}</div>`;
              })()}
            </div>`:''}
          </div>`;}).join('')}
      </div>`:''}
    </div>
  </div>`;
}

          const storeObj=firstV.objManuel?.[m]??firstV.objSheetAuto?.[m]??calcObj(magCa25,augm,m);

          const palM=getPaliersMois(comp,m);
          let matched=false;
          for(let pi=palM.length-1;pi>=0;pi--){
            const pp=palM[pi];const op=pp.operateur||'>=';
            let ok=false;if(op==='>=')ok=t>=pp.seuil;else if(op==='<=')ok=t<=pp.seuil;else if(op==='>')ok=t>pp.seuil;else ok=t<pp.seuil;

          const storeCa=firstV.caSaisie?.[m]??firstV.caSheetAuto?.[m];
          if(!storeCa||storeCa<=0){sous++;continue;}
          const formuleMois=getFormuleMois(comp,year,m,mag);const augm=(formuleMois.augmentation!=null?formuleMois.augmentation:2);
          const storeObj=firstV.objManuel?.[m]??firstV.objSheetAuto?.[m]??calcObj(magCa25,augm,m);
          const t=(storeCa/storeObj)*100;
          const palM=getPaliersMois(comp,m);
          let matched=false;
          for(let pi=palM.length-1;pi>=0;pi--){
            const pp=palM[pi];const op=pp.operateur||'>=';
            let ok=false;if(op==='>=')ok=t>=pp.seuil;else if(op==='<=')ok=t<=pp.seuil;else if(op==='>')ok=t>pp.seuil;else ok=t<pp.seuil;
            if(ok){pc[pi]++;matched=true;break;}
          }
          if(!matched)sous++;
        }
      }
    }
  } else {
    const allVendeurs = new Set();
    for(const mag of comp.magasins){
      const ca25=mag.totalCA2025||100000;
      for(const v of mag.vendeurs){
        const isVolant = v.type === 'volant' || /volant|divers/i.test(mag.nom);
        if(isVolant)continue;
        if(v.parti)continue;
        allVendeurs.add(v.nom);
        let hasCA=false;
        for(const m of moisToCheck){

            const obj=v.objManuel?.[m]??v.objSheetAuto?.[m]??calcObj(ca25,augm,m);
            const t=(ca/obj)*100;const palM=getPaliersMois(comp,m);const pr=calcPrime(t,palM)*(v.tempsPartielMois?.[m]??100)/100;total+=pr;
            let matched=false;

              if(ok){pc[pi]++;matched=true;break;}

    <div class="st" style="background:#f5f3ff"><small style="color:var(--vol)">Vendeurs Volants</small><b style="color:var(--vol)">${type==='volants'?totVol:0}</b></div>

  paliersRef.forEach((p,i)=>{const op=p.operateur||'>=';const opS=OPS.find(o=>o.val===op)?.short||'≥';
    const colorClass=tc(p.seuil);
    const bgColors={g:'#f0fdf4',b:'#eff6ff',o:'#fff7ed',r:'#fef2f2'};
    const textColors={g:'var(--grn)',b:'var(--blu)',o:'var(--org)',r:'var(--red)'};
    const bgStyle=colorClass?`background:${bgColors[colorClass]}`:'background:#f8fafc';
    const colorStyle=colorClass?`color:${textColors[colorClass]}`:'';
    h+=`<div class="st" style="${bgStyle}"><small style="opacity:.7">${opS}${p.seuil}%</small><b style="${colorStyle}">${pc[i]||0}</b><span>${p.prime}€</span></div>`;});
  return h+'</div>';}

function renderPartisSection(comp, companyName, year){
  // Collecter tous les vendeurs partis (fixes et volants)
  const partis = [];
  for(const mag of comp.magasins){
    for(const v of mag.vendeurs){
      if(v.parti && v.dateParti && v.dateParti.startsWith(String(year))){
        partis.push({nom: v.nom, p25: v.p25, magasinOrigine: mag.nom, type: 'fixe'});
      }
    }
  }
  for(const vl of (comp.volants||[])){
    if(vl.parti && vl.dateParti && vl.dateParti.startsWith(String(year))){
      partis.push({nom: vl.nom, p25: vl.p25, magasinOrigine: 'Volant', type: 'volant'});
    }
  }
  for(const alt of (comp.alternants||[])){
    if(alt.parti && alt.dateParti && alt.dateParti.startsWith(String(year))){
      partis.push({nom: alt.nom, p25: alt.p25, magasinOrigine: alt.magasin||'Alternant', type: 'alternant'});
    }
  }

  if(!partis.length) return '';
  
  const ac=esc(companyName || S.activeComp);
  let h=`<div class="vol-section" style="border-top:2px solid #fee2e2;background:#fef2f2;margin-top:24px">
    <div class="vol-section-hd" style="background:#fef2f2">
      <div class="vol-section-title" style="color:var(--red)">🚪 Vendeurs partis</div>
      <span style="font-size:11px;color:#991b1b">${partis.length} vendeur(s) ayant quitté l'entreprise</span>
    </div>
    <div class="vol-section-desc" style="color:#991b1b">Ces vendeurs ont quitté l'entreprise. Leurs données sont conservées mais n'impactent plus les calculs. Vous pouvez les supprimer définitivement.</div>
    <div class="vol-chips" style="background:#fff">`;
  
  partis.forEach(v=>{
    let badge='<span class="badge-fixe">FIXE</span>';
    if(v.type==='volant')badge='<span class="badge-vol">VOL</span>';
    else if(v.type==='alternant')badge='<span class="badge-alt">ALT</span>';
    h+=`<div class="vol-chip parti-vend" style="border:1px solid #fca5a5">
      ${badge}<b>${v.nom}</b>
      <span style="color:var(--tx3);font-size:10px">${v.magasinOrigine} · ${fmtE(v.p25)} (2025)</span>
      <span class="badge-parti">PARTI</span>
      <button class="btn btn-sm btn-danger" style="font-size:10px;padding:3px 8px" onclick="if(confirm('Supprimer définitivement ${esc(v.nom)} ? Cette action est irréversible.'))doDeleteVendeur('${ac}','${esc(v.nom)}')">🗑️ Supprimer</button>
    </div>`;
  });
  
  return h+`</div></div>`;
}

function renderAlternantSection(comp){
  const ac=esc(S.activeComp);
  let h=`<div class="alt-section"><div class="alt-section-hd"><div class="alt-section-title">📚 Gestion des Alternants</div>
    <button class="btn btn-sm" style="background:#fff;border:1px solid #86efac;color:#166534" onclick="showAddAlternantModal('${ac}')">+ Ajouter alternant</button></div>
    <div class="alt-section-desc">Les alternants combinent des jours en école et en entreprise. Leur prime dépend de leur période d'activité.</div>`;
  if(!(comp.alternants||[]).length)h+=`<div style="font-size:12px;color:var(--tx3)">Aucun alternant pour cette société.</div>`;
  else{
    const altsActifs=(comp.alternants||[]).filter(a=>isActiveInMonth(a.dateParti,S.selectedYear,S.mois));
    if(!altsActifs.length){
      h+=`<div style="font-size:12px;color:var(--tx3)">Tous les alternants ont quitté l'entreprise. Consultez le Récapitulatif pour les voir.</div>`;
    }else{
      h+=`<div class="vol-chips">`;
      altsActifs.forEach(a=>{h+=`<div class="vol-chip" style="border:1px solid #86efac;background:#f0fdf4">
        <span class="badge-alt">ALT</span><b>${a.nom}</b>
        <span style="color:var(--tx3);font-size:10px">${a.magasin||'?'}</span>
        <button style="background:none;border:none;color:#059669;font-size:14px;cursor:pointer" onclick="doToggleAlternantParti('${ac}','${esc(a.nom)}')">⚙️</button>
        <button style="background:none;border:none;color:#16a34a;font-size:14px;cursor:pointer" onclick="doRemoveAlternant('${ac}','${esc(a.nom)}')">×</button>
        </div>`;});h+=`</div>`;
    }

    if(S.mois!=='all'){
      const mIdx=parseInt(S.mois);const cn=S.activeComp;const year=S.selectedYear||2025;
      // Filtrer les alternants actifs ce mois (exclure ceux avec CDI/CDD ce mois)
      const altsM=altsActifs.filter(a=>{
        if(!a.cdiDate) return true; // Pas de CDI/CDD
        const [mCDI]=String(a.cdiDate).split('-'); // Format: "5" ou "2025-05-01"
        const moisCDI=parseInt(mCDI)||0;
        return moisCDI > mIdx || moisCDI === 0; // Actif si CDI après ce mois
      });
      if(!altsM.length){
        h+=`<div style="font-size:12px;color:var(--tx3);margin-top:12px">Aucun alternant actif ce mois.</div>`;
      }else{
        // Ligne école par alternant
        h+=`<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 14px;margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:#166534;margin-bottom:8px">📚 École — ${M[mIdx]}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">`;
        altsM.forEach(a=>{
          const ecoleJours=a.joursEcole?.[mIdx]??null;
          h+=`<div style="background:#fff;border:1px solid #86efac;border-radius:6px;padding:6px 10px;min-width:120px">
            <div style="font-size:10px;color:#166534;font-weight:700;margin-bottom:4px">${a.nom.split(' ')[0]}</div>
            <div style="display:flex;align-items:center;gap:4px">
              <input type="number" min="0" placeholder="0" style="width:44px;padding:3px 4px;border:1px solid #86efac;border-radius:4px;font-size:12px;font-weight:700;text-align:center" value="${ecoleJours!=null?ecoleJours:''}" onchange="doSaveAlternantJours('${ac}','${esc(a.nom)}','ecole',${mIdx},this.value)"/>
              <span style="font-size:11px;color:#166534">j</span>
            </div>
          </div>`;});
        h+=`</div></div>`;

        // Ligne absences par alternant
        h+=`<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:#c2410c;margin-bottom:8px">🚫 Absences — ${M[mIdx]}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">`;
        altsM.forEach(a=>{
          const absEntry=(S.alternantAbsences||[]).find(x=>x.societe===cn&&x.alternant===a.nom&&x.mois===mIdx);
          const joursAbs=absEntry?.jours||null;
          h+=`<div style="background:#fff;border:1px solid #fde68a;border-radius:6px;padding:6px 10px;min-width:120px">
            <div style="font-size:10px;color:#c2410c;font-weight:700;margin-bottom:4px">${a.nom.split(' ')[0]}</div>
            <div style="display:flex;align-items:center;gap:4px">
              <input type="number" min="0" placeholder="0" style="width:44px;padding:3px 4px;border:1px solid #fde68a;border-radius:4px;font-size:12px;font-weight:700;text-align:center" value="${joursAbs!=null?joursAbs:''}" onchange="doSaveAlternantAbsences('${ac}','${esc(a.nom)}',${mIdx},this.value)"/>
              <span style="font-size:11px;color:#c2410c">j</span>
            </div>
          </div>`;});
        h+=`</div></div>`;

        // Affectations par magasin pour les alternants
        const diviseurParAlt={};
        altsM.forEach(a=>{
          const totalJoursMags=(S.alternantJours||[]).filter(x=>x.societe===cn&&x.alternant===a.nom&&x.mois===mIdx&&x.jours>0).reduce((s,x)=>s+x.jours,0);
          const ecoleJours=a.joursEcole?.[mIdx]??0;
          const absEntry=(S.alternantAbsences||[]).find(x=>x.societe===cn&&x.alternant===a.nom&&x.mois===mIdx);
          const joursAbs=absEntry?.jours||0;
          diviseurParAlt[a.nom]=totalJoursMags+ecoleJours+joursAbs;
        });
        const primAltMag=(altNom,mag)=>{
          const magCa25=mag.totalCA2025||100000;
          const firstV=mag.vendeurs[0];if(!firstV)return 0;
          const storeCa=firstV.caSaisie?.[mIdx]??firstV.caSheetAuto?.[mIdx];
          if(!storeCa||storeCa<=0)return 0;
          const fmois=getFormuleMois(comp,year,mIdx,mag);const augm=(fmois.augmentation!=null?fmois.augmentation:2);
          const storeObj=firstV.objManuel?.[mIdx]??firstV.objSheetAuto?.[mIdx]??calcObj(magCa25,augm,mIdx);
          const primeMag=calcPrime((storeCa/storeObj)*100,getPaliersMois(comp,mIdx));
          if(primeMag<=0)return 0;
          const aj=(S.alternantJours||[]).find(x=>x.societe===cn&&x.alternant===altNom&&x.magasin===mag.nom&&x.mois===mIdx);
          if(!aj||!aj.jours||aj.jours<=0)return 0;
          const div=diviseurParAlt[altNom]||1;
          return parseFloat(((aj.jours/div)*primeMag).toFixed(2));
        };
        h+=`<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 14px;margin-top:12px">
          <div style="font-size:11px;font-weight:700;color:#166534;margin-bottom:8px">Affectations — ${M[mIdx]}</div>`;
        filterNormalMagasins(comp.magasins).forEach(mag=>{
          const magCa25=mag.totalCA2025||100000;
          const firstV=mag.vendeurs[0];
          const storeCa=firstV?(firstV.caSaisie?.[mIdx]??firstV.caSheetAuto?.[mIdx]):null;
          const fmoisA=getFormuleMois(comp,year,mIdx);const augmA=(fmoisA.augmentation!=null?fmoisA.augmentation:2);
          const storeObj=firstV?(firstV.objManuel?.[mIdx]??firstV.objSheetAuto?.[mIdx]??calcObj(magCa25,augmA,mIdx)):calcObj(magCa25,augmA,mIdx);
          const storeTaux=storeCa!=null?(storeCa/storeObj)*100:null;
          const cMag=tcMois(storeTaux,getPaliersMois(comp,mIdx));
          h+=`<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:6px">📍 ${mag.nom}</div><div class="mgrid">`;
          altsM.forEach(a=>{
            const aj=(S.alternantJours||[]).find(x=>x.societe===cn&&x.alternant===a.nom&&x.magasin===mag.nom&&x.mois===mIdx);
            const joursAlt=aj?aj.jours:null;
            const prime=primAltMag(a.nom,mag);
            const participation=joursAlt!=null?(joursAlt/(diviseurParAlt[a.nom]||1))*100:null;
            const primeColorAlt=prime<=0?'var(--tx3)':(cMag?'tx-'+cMag:'var(--grn)');
            h+=`<div class="mc wide ${cMag?'bg-'+cMag:''}">
              <div class="mc-lbl" style="color:#16a34a">${a.nom.split(' ')[0]}</div>
              <input type="number" placeholder="Jours" value="${joursAlt!=null?joursAlt:''}" onchange="doSaveAlternantJoursMagasin('${ac}','${esc(a.nom)}','${esc(mag.nom)}',${mIdx},this.value)"/>
              ${joursAlt!=null?`<div class="mc-res"><span class="tx-${cMag}">${participation!=null?participation.toFixed(1)+'%':''}</span><span class="${primeColorAlt}">${fmtPrime(prime)}</span></div>`:''}
            </div>`;});
          h+=`</div></div>`;});
        h+=`</div></div>`;
        // Total mensuel par alternant
        h+=`<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 14px;margin-top:8px">
          <div style="font-size:11px;font-weight:700;color:#166534;margin-bottom:8px">Total prime — ${M[mIdx]}</div>
          <div style="display:flex;gap:12px;flex-wrap:wrap">`;
        altsM.forEach(a=>{
          const total=getAlternantTotalPrimeMois(cn,comp,a,mIdx,year);
          h+=`<div style="background:#fff;border:1px solid #86efac;border-radius:6px;padding:6px 12px;text-align:center">
            <div style="font-size:10px;color:#166534;font-weight:700">${a.nom.split(' ')[0]}</div>
            <div style="font-size:16px;font-weight:800;color:${total>0?'var(--grn)':'var(--tx3)'}">${fmtPrime(total)}</div>
          </div>`;});
        h+=`</div></div>`;
      }
    }else{
      // Vue "Tous" : tableau primes par mois pour chaque alternant (SEULEMENT les alternants)
      const cn=S.activeComp;const year=S.selectedYear||2025;
      const actAlts2=(comp.alternants||[]).filter(a=>isActiveInMonth(a.dateParti,S.selectedYear,S.mois));
      if(actAlts2.length){
        h+=`<div style="overflow-x:auto;margin-top:8px"><table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="background:#f0fdf4">
            <th style="padding:6px 10px;text-align:left;color:#166534;font-weight:700">Alternant</th>
            ${MS.map(m=>`<th style="padding:6px 8px;text-align:right;color:var(--tx2);font-weight:600">${m}</th>`).join('')}
            <th style="padding:6px 10px;text-align:right;color:#166534;font-weight:700">Total</th>
          </tr></thead><tbody>`;
        actAlts2.forEach(a=>{
          const pm=new Array(12).fill(0).map((_,m)=>getAlternantTotalPrimeMois(cn,comp,a,m,year));
          const tot=pm.reduce((s,p)=>s+p,0);
          h+=`<tr style="border-top:1px solid #dcfce7">
            <td style="padding:6px 10px;font-weight:600;color:#166534">${a.nom}</td>
            ${pm.map(p=>`<td style="padding:6px 8px;text-align:right;color:${p>0?'var(--grn)':'var(--tx3)'};font-weight:${p>0?'700':'400'}">${p>0?fmtPrime(p):'—'}</td>`).join('')}
            <td style="padding:6px 10px;text-align:right;font-weight:800;color:${tot>0?'#166534':'var(--tx3)'}">${tot>0?fmtPrime(tot):'—'}</td>
          </tr>`;
        });
        h+=`</tbody></table></div>`;
      }else{
        h+=`<div style="font-size:12px;color:var(--tx3);text-align:center;padding:20px">Aucun alternant pour cette société.</div>`;
      }
      h+=`<div style="font-size:11px;color:var(--tx3);margin-top:8px">👆 Sélectionnez un mois pour gérer les jours d'école/entreprise.</div>`;
    }
  }
  return h+'</div>';}

// ══════ SECTION ARCHIVÉS (vendeurs/volants/alternants/magasins partis) ══════
function renderArchivesSection(comp, cn){
  let h=`<div style="background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px">
    <div style="font-size:14px;font-weight:800;margin-bottom:12px">📦 Archivés</div>`;

  // Vendeurs partis (dans tous les magasins)
  const year=S.selectedYear||2025;
  const vendeursPartis=[];
  for(const mag of comp.magasins||[]){
    for(const v of mag.vendeurs||[]){
      if(v.dateParti && v.dateParti.startsWith(String(year))) vendeursPartis.push({nom:v.nom,magasin:mag.nom,dateParti:v.dateParti,p25:v.p25});
    }
  }

  // Volants partis
  const volantsPartis=(comp.volants||[]).filter(v=>v.dateParti && v.dateParti.startsWith(String(year)));

  // Alternants partis
  const altsPartis=(comp.alternants||[]).filter(a=>a.dateParti && a.dateParti.startsWith(String(year)));

  // Magasins fermés
  const magasinsFermes=(comp.magasins||[]).filter(m=>m.dateFermeture && String(m.dateFermeture).startsWith(String(year)));

  if(vendeursPartis.length){
    h+=`<div style="margin-bottom:12px"><h4 style="font-size:12px;color:var(--tx2);margin-bottom:8px">👤 Vendeurs Fixes Partis</h4>`;
    for(const v of vendeursPartis){
      h+=`<div style="background:#f8fafc;border:1px solid var(--brd);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:700;font-size:12px">${v.nom}</div><div style="font-size:10px;color:var(--tx3)">${v.magasin} • Parti le ${v.dateParti}</div></div>
        <button class="btn btn-sm" onclick="doToggleParti('${cn}','${esc(v.magasin)}','${esc(v.nom)}',false)">↩ Réactiver</button>
      </div>`;
    }
    h+=`</div>`;
  }

  if(volantsPartis.length){
    h+=`<div style="margin-bottom:12px"><h4 style="font-size:12px;color:var(--tx2);margin-bottom:8px">🔄 Vendeurs Volants Partis</h4>`;
    for(const v of volantsPartis){
      h+=`<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:700;font-size:12px">${v.nom}</div><div style="font-size:10px;color:var(--tx3)">Parti le ${v.dateParti}</div></div>
        <button class="btn btn-sm" onclick="doReactiverVolant('${cn}','${esc(v.nom)}')">↩ Réactiver</button>
      </div>`;
    }
    h+=`</div>`;
  }

  if(altsPartis.length){
    h+=`<div style="margin-bottom:12px"><h4 style="font-size:12px;color:var(--tx2);margin-bottom:8px">📚 Alternants Partis</h4>`;
    for(const a of altsPartis){
      h+=`<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:700;font-size:12px">${a.nom}</div><div style="font-size:10px;color:var(--tx3)">Parti le ${a.dateParti}</div></div>
        <button class="btn btn-sm" onclick="doReactiverAlternant('${cn}','${esc(a.nom)}')">↩ Réactiver</button>
      </div>`;
    }
    h+=`</div>`;
  }

  if(magasinsFermes.length){
    h+=`<div style="margin-bottom:12px"><h4 style="font-size:12px;color:var(--tx2);margin-bottom:8px">🚪 Magasins Fermés</h4>`;
    for(const m of magasinsFermes){
      h+=`<div style="background:#fee2e2;border:1px solid #fecaca;border-radius:8px;padding:10px;margin-bottom:6px">
        <div style="font-weight:700;font-size:12px">${m.nom}</div>
        <div style="font-size:10px;color:var(--tx3)">Fermé le ${m.dateFermeture}</div>
      </div>`;
    }
    h+=`</div>`;
  }

  if(!vendeursPartis.length && !volantsPartis.length && !altsPartis.length && !magasinsFermes.length){
    h+=`<div style="text-align:center;color:var(--tx3);font-size:12px;padding:20px">Aucun archivé pour le moment</div>`;
  }

  return h+'</div>';}

function p25Bar(){
  const tot={};let g=0;
  for(const[cn,comp]of Object.entries(S.data.companies)){tot[cn]=0;
    for(const mag of comp.magasins)for(const v of mag.vendeurs)tot[cn]+=v.p25||0;g+=tot[cn];}
  let h=`<div class="p25-bar"><div class="p25-bar-title">Total primes 2025 par société</div><div class="p25-cards">`;
  for(const[cn,t]of Object.entries(tot))h+=`<div class="p25-card"><small>${cn}</small><b>${fmtE(t)}</b></div>`;
  return h+`<div class="p25-card p25-card-total"><small>🏆 Total général</small><b>${fmtE(g)}</b></div></div></div>`;}

function renderVendeursPage(){
  const subTabs=`<div class="nav-tabs" style="margin-bottom:0">

    <button class="tab ${S.subTab==='volants'?'vol-on':''}" onclick="S.subTab='volants';render()">🔄 Vendeurs Volants</button>

    <button class="tab ${S.subTab==='archives'?'on':''}" onclick="S.subTab='archives';render()">📦 Archivés</button>
  </div>`;
  let content='';
  if(S.subTab==='fixes')content=renderFixedListPanel();
  else if(S.subTab==='volants')content=renderVolantListPanel();
  else if(S.subTab==='magasins')content=renderMagasinPanel();
  else content=renderArchivesListPanel();
  return p25Bar()+`<div class="list-panel"><div style="padding:12px 16px;border-bottom:1px solid #f1f5f9">${subTabs}</div>${content}</div>`;}

function collectFixed(){
  const all=[];
  const year=S.selectedYear||2025;
  const resultMonths=getResultMonths(year);
  for(const[cn,comp]of Object.entries(S.data.companies)){
    for(const mag of comp.magasins){const ca25=mag.totalCA2025||100000;
      const nActifs=mag.vendeurs.filter(v=>isActiveInMonth(v.dateParti,S.selectedYear,S.mois)).length||1;
      for(const v of mag.vendeurs){
        if(!isActiveInMonth(v.dateParti,S.selectedYear,S.mois))continue;
        let tp=0;
        for(const m of resultMonths){const ca=v.caSaisie?.[m]??v.caSheetAuto?.[m];if(ca==null)continue;
          const formuleMois=getFormuleMois(comp,year,m,mag);const augm=(formuleMois.augmentation!=null?formuleMois.augmentation:2);
          const obj=v.objManuel?.[m]??v.objSheetAuto?.[m]??calcObj(ca25,augm,m);const primeMagC=calcPrime((ca/obj)*100,getPaliersMois(comp,m))*(v.tempsPartielMois?.[m]??100)/100;tp+=primeMagC;}
        all.push({nom:v.nom,societe:cn,magasin:mag.nom,manager:mag.manager||comp.manager||'',parti:!!v.parti,p26:tp,p25:v.p25||0});}}}
  return all;}

function filterSort(all,search,filter,isVol=false){
  let f=all.filter(v=>{
    if(filter==='actif'&&v.parti)return false;if(filter==='parti'&&!v.parti)return false;
    if(search)return v.nom.toLowerCase().includes(search)||v.societe.toLowerCase().includes(search)||(v.magasin||'').toLowerCase().includes(search)||(v.manager||'').toLowerCase().includes(search);
    return true;});
  f.sort((a,b)=>{if(a.parti&&!b.parti)return 1;if(!a.parti&&b.parti)return-1;return a.nom.localeCompare(b.nom,'fr');});
  return f;}

function buildFixRows(rows){
  if(!rows.length)return`<div class="list-empty">Aucun vendeur fixe trouvé.</div>`;
  return rows.map(v=>{const d=v.p26-v.p25;const dS=d===0?'':(d>0?`<span style="color:var(--red);font-size:10px">▲${fmtE(Math.abs(d))}</span>`:`<span style="color:var(--grn);font-size:10px">▼${fmtE(Math.abs(d))}</span>`);
    return`<div class="vrow${v.parti?' parti-row':''}">
      <div class="vrow-left"><div class="vrow-av${v.parti?' parti':''}">${ini(v.nom)}</div>
        <div class="vrow-info">
          <div class="vrow-nom">${v.nom} <span class="badge-fixe">FIXE</span>${v.parti?' <span class="badge-parti">PARTI</span>':''}</div>

        <div style="font-size:10px;color:var(--tx3)">2025 : ${fmtE(v.p25)} ${dS}</div>
      </div></div></div>`;}).join('');}

// ══════ RECAP PAR SOCIÉTÉ ══════
// Modes : 'annuel' = vue synthèse | 'mensuel' = vue RH mois par mois
// S.recapMode et S.recapMois pour navigation

function renderRecap(){
  // ── Calcul global avec données mensuelles ──
  const year=S.selectedYear||2025;
  const resultMonths=getResultMonths(year);
  const socData={};let gYear=0;
  const grandMois=new Array(12).fill(0);
  
  for(const[cn,comp]of Object.entries(S.data.companies)){
    const sd={name:cn,manager:comp.manager||'',magasins:[],
      totalYear:0,total25:0,total26:0,primesParMois:new Array(12).fill(0),
      nVend:0,nParti:0,nVolants:(comp.volants||[]).filter(v=>isActiveInMonth(v.dateParti,S.selectedYear,S.mois)).length,nAlternants:(comp.alternants||[]).filter(a=>isActiveInMonth(a.dateParti,S.selectedYear,S.mois)).length};

    for(const mag of comp.magasins){
      if(!isActiveInMonth(mag.dateFermeture,S.selectedYear,S.mois))continue;
      const ca25=mag.totalCA2025||100000;
      const nActifs=mag.vendeurs.filter(v=>isActiveInMonth(v.dateParti,S.selectedYear,S.mois)).length||1;
      const md={nom:mag.nom,manager:mag.manager||comp.manager||'',ca25,vendeurs:[],totalYear:0,primesParMois:new Array(12).fill(0)};

      for(const v of mag.vendeurs){
        if(!isActiveInMonth(v.dateParti,S.selectedYear,S.mois))continue;
        let tp=0,tpReel=0,mc=0;const pm=new Array(12).fill(0);
        for(const m of resultMonths){
          const formuleMois=getFormuleMois(comp,year,m,mag);
          const augm=(formuleMois.augmentation!=null?formuleMois.augmentation:2);
          const ca=v.caSaisie?.[m]??v.caSheetAuto?.[m];
          const obj=v.objManuel?.[m]??v.objSheetAuto?.[m]??calcObj(ca25,augm,m);
          if(ca!=null){mc++;const primeMagR=calcPrime((ca/obj)*100,getPaliersMois(comp,m))*(v.tempsPartielMois?.[m]??100)/100;const pr=primeMagR;tp+=pr;pm[m]=pr;if(year===2026&&m>=3)tpReel+=pr;else if(year!==2026)tpReel=tp;}}

        const tpForTotal=year===2026?tpReel:tp;

        // Calculer primes année précédente
        let tpPrev=0;
        if(year>2026){for(let m=0;m<12;m++){const formuleMois=getFormuleMois(comp,year-1,m,mag);const augm=(formuleMois.augmentation!=null?formuleMois.augmentation:2);const ca=v.caSaisie?.[m]??v.caSheetAuto?.[m];const obj=v.objManuel?.[m]??v.objSheetAuto?.[m]??calcObj(ca25,augm,m);if(ca!=null){const primeMagR=calcPrime((ca/obj)*100,getPaliersMois(comp,year-1,m))*(v.tempsPartielMois?.[m]??100)/100;tpPrev+=primeMagR;}}} else {tpPrev=v.p25||0;}

        md.vendeurs.push({nom:v.nom,pPrev:tpPrev,pCurr:year===2026?tpReel:tp,pm,months:mc,parti:!!v.parti});
        if(!v.parti){md.totalYear+=tpForTotal;for(let m=0;m<12;m++)md.primesParMois[m]+=pm[m];}
        if(!v.parti){sd.totalYear+=tpForTotal;sd.total26+=tpForTotal;sd.total25+=tpPrev;for(let m=0;m<12;m++)sd.primesParMois[m]+=pm[m];}
        sd.nVend+=(v.parti?0:1);sd.nParti+=(v.parti?1:0);
        if(!v.parti){gYear+=tpForTotal;for(let m=0;m<12;m++)grandMois[m]+=pm[m];}}
      
      sd.magasins.push(md);}
    
    // ══ AJOUTER LES PRIMES DES VOLANTS ═══════════════════════════════
    for(const vl of (comp.volants||[])){
      if(!isActiveInMonth(vl.dateParti,S.selectedYear,S.mois))continue;
      if(!vl.parti){
        let p=0;let pReel=0;for(const m of resultMonths){const pm=getVolantTotalPrimeMois(cn,comp,vl,m,year);p+=pm;if(year===2026&&m>=3)pReel+=pm;else if(year!==2026)pReel=p;}
        const pForTotal=year===2026?pReel:p;
        sd.totalYear+=pForTotal;sd.total26+=pForTotal;
        gYear+=pForTotal;
      }
    }
    // ══ AJOUTER LES PRIMES DES ALTERNANTS ════════════════════════════════
    for(const alt of (comp.alternants||[])){
      if(!isActiveInMonth(alt.dateParti,S.selectedYear,S.mois))continue;
      if(!alt.parti){
        let p=0;let pReel=0;for(const m of resultMonths){const pm=getAlternantTotalPrimeMois(cn,comp,alt,m,year);p+=pm;if(year===2026&&m>=3)pReel+=pm;else if(year!==2026)pReel=p;}
        const pForTotal=year===2026?pReel:p;
        sd.totalYear+=pForTotal;sd.total26+=pForTotal;
        gYear+=pForTotal;
      }
    }
    // ═════════════════════════════════════════════════════════════════════

    socData[cn]=sd;}

  const mode=S.recapMode||'annuel';
  const moisSel=S.recapMois??null;

  // ── Bandeau global (toujours affiché) ──
  let h=`<div class="p25-bar"><div class="p25-bar-title">Synthèse globale — toutes sociétés</div><div class="p25-cards">`;
  for(const sd of Object.values(socData)){
    h+=`<div class="p25-card" style="cursor:pointer" onclick="document.getElementById('soc-${esc(sd.name)}')?.scrollIntoView({behavior:'smooth'})">
      <small>${sd.name}</small><b>${fmtE(sd.totalYear)}</b>
      <sub>Primes ${year}</sub>
    </div>`;}
  h+=`<div class="p25-card p25-card-total"><small>🏆 Total ${year}</small><b>${fmtE(gYear)}</b></div></div></div>`;

  // ── Sélecteur de mode ──
  h+=`<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
    <button class="tab ${mode==='annuel'?'on':''}" onclick="S.recapMode='annuel';render()">📊 Vue annuelle</button>
    <button class="tab ${mode==='mensuel'?'on':''}" onclick="S.recapMode='mensuel';S.recapMois=S.recapMois??0;render()">📅 Vue mensuelle RH</button>
    ${mode==='mensuel'?`<div style="display:flex;gap:3px;flex-wrap:wrap;margin-left:8px">
      ${MS.map((m,i)=>`<button class="mt ${moisSel===i?'on':''}" onclick="S.recapMois=${i};render()">${m}</button>`).join('')}
    </div>`:''}
  </div>`;
  
  // ── Onglets sociétés pour vue annuelle ──
  if(mode==='annuel'){
    const socNames=Object.keys(socData);
    const selSoc=S.recapAnnuelSoc||'all';
    h+=`<div class="rh-tabs">
      <button class="rh-tab ${selSoc==='all'?'all-on':''}" onclick="S.recapAnnuelSoc='all';render()">🌐 Toutes</button>
      ${socNames.map(cn=>`<button class="rh-tab ${selSoc===cn?'on':''}" onclick="S.recapAnnuelSoc='${esc(cn)}';render()">${cn}</button>`).join('')}
    </div>`;
  }

  if(mode==='annuel'){
    h+=renderRecapAnnuel(socData,year,S.recapAnnuelSoc||'all');
  } else {
    const mIdx=moisSel??0;
    h+=renderRecapMensuel(socData,year,mIdx,grandMois);
  }

  // ── Grand total bar ──
  h+=`<div style="background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:14px;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:#fff;margin-bottom:16px">
    <div style="font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:1px">🏆 Grand Total — Toutes sociétés</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div style="background:#ffffff12;border-radius:10px;padding:8px 20px;text-align:center">
        <div style="font-size:9px;opacity:.4;text-transform:uppercase;letter-spacing:1px">Total primes ${year}</div>
        <div style="font-size:22px;font-weight:800">${fmtE(gYear)}</div>
      </div>
    </div>
  </div>`;
  return h;
}

// ── Vue annuelle : un bloc par société, vendeurs en lignes, total annuel ──
function renderRecapAnnuel(socData,year,selectedSoc='all'){
  let h='';
  const societes = selectedSoc === 'all' ? Object.entries(socData) : [[selectedSoc, socData[selectedSoc]]].filter(([k,v])=>v);
  
  for(const[cn,sd]of societes){
    const ecart=sd.total26-sd.total25;
    h+=`<div class="mag" id="soc-${esc(cn)}" style="margin-bottom:16px">
      <div class="mag-h" style="background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff">
        <div>
          <div style="font-size:9px;text-transform:uppercase;letter-spacing:2px;opacity:.4;margin-bottom:2px">Société</div>
          <div style="font-weight:800;font-size:16px">${cn}</div>
          <div style="font-size:10px;opacity:.5;margin-top:2px">👤 ${sd.manager||'—'} · ${filterNormalMagasins(sd.magasins).length} magasin(s) · ${sd.nVend} vendeurs fixes${sd.nParti?' · <span style="color:#fca5a5">'+sd.nParti+' parti(s)</span>':''} · ${sd.nVolants} volant(s) · ${sd.nAlternants||0} alternant(s)</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div style="background:#ffffff12;border-radius:10px;padding:8px 14px;text-align:center">
            <div style="font-size:9px;opacity:.4;text-transform:uppercase;letter-spacing:1px">Primes ${year}</div>
            <div style="font-size:17px;font-weight:800">${fmtE(sd.totalYear)}</div>
          </div>
        </div>
      </div>
      <div style="overflow-x:auto"><table class="rtbl">
        <thead><tr style="background:#f8fafc">
          <th style="padding-left:16px">Vendeur</th>
          <th>Magasin</th>
          <th class="r">Primes ${year-1}</th>
          <th class="r">Mois saisis</th>
          <th class="r">Primes ${year}</th>
          <th class="r">Écart</th>
        </tr></thead><tbody>`;
    for(const md of sd.magasins){
      md.vendeurs.filter(v => !v.parti).forEach(v=>{
        const d=v.pCurr-v.pPrev;const cl=d>0?'var(--red)':d<0?'var(--grn)':'var(--tx3)';const ar=d>0?'▲':d<0?'▼':'';
        h+=`<tr>
          <td style="padding:7px 12px 7px 16px;font-size:12px">${v.nom} <span class="badge-fixe">FIXE</span></td>
          <td style="font-size:11px;color:var(--tx3)">${md.nom}</td>
          <td class="r" style="color:var(--tx3)">${fmtE(v.pPrev)}</td>
          <td class="r" style="color:var(--tx3)">${v.months}/12</td>
          <td class="r" style="font-weight:800">${fmtE(v.pCurr)}</td>
          <td class="r" style="font-weight:600;color:${cl}">${ar+' '+fmtE(Math.abs(d))}</td>
        </tr>`;
      });
    }
    
    // ══ AJOUTER LES VOLANTS ACTIFS UNIQUEMENT ══════════════════════════════════════════
    const comp=S.data.companies[cn];
    if(comp&&comp.volants&&comp.volants.length>0){
      const volantsActifs = comp.volants.filter(vl => !vl.parti);
      
      if(volantsActifs.length > 0){
        h+=`<tr style="background:#f5f3ff">
          <td colspan="2" style="padding:8px 12px 8px 16px;font-size:12px;font-weight:700;color:var(--vol)">🔄 <b>Vendeurs Volants</b></td>
          <td class="r" style="color:var(--tx3)">—</td>
          <td class="r" style="color:var(--tx3)">—</td>
          <td class="r" style="color:var(--tx3)">—</td>
          <td class="r" style="color:var(--tx3)">—</td>
        </tr>`;
        
        volantsActifs.forEach(vl=>{
          let pPrev=vl.p25||0;
          let pCurr=0;const pmCurr=new Array(12).fill(0);
          for(const m of getResultMonths(year)){pmCurr[m]=getVolantTotalPrimeMois(cn,comp,vl,m,year);pCurr+=pmCurr[m];}
          if(year>2025){pPrev=0;for(const m of getResultMonths(year-1)){pPrev+=getVolantTotalPrimeMois(cn,comp,vl,m,year-1);}}
          const moisSaisis=pmCurr.filter(p=>p>0).length;
          const d=pCurr-pPrev;
          const cl=d>0?'var(--red)':d<0?'var(--grn)':'var(--tx3)';
          const ar=d>0?'▲':d<0?'▼':'';

          h+=`<tr>
            <td style="padding:7px 12px 7px 32px;font-size:12px">${vl.nom} <span class="badge-vol">VOLANT</span></td>
            <td style="font-size:11px;color:var(--vol)">Multi-magasins</td>
            <td class="r" style="color:var(--tx3)">${fmtE(pPrev)}</td>
            <td class="r" style="color:var(--tx3)">${moisSaisis}/12</td>
            <td class="r" style="font-weight:800">${fmtE(pCurr)}</td>
            <td class="r" style="font-weight:600;color:${cl}">${ar+' '+fmtE(Math.abs(d))}</td>
          </tr>`;
        });
      }
    }

    // ══ AJOUTER LES ALTERNANTS ACTIFS UNIQUEMENT ══════════════════════════════════════════
    if(comp&&comp.alternants&&comp.alternants.length>0){
      const alternantsActifs = comp.alternants.filter(a => !a.parti);

      if(alternantsActifs.length > 0){
        h+=`<tr style="background:#f0fdf4">
          <td colspan="2" style="padding:8px 12px 8px 16px;font-size:12px;font-weight:700;color:#166534">📚 <b>Alternants</b></td>
          <td class="r" style="color:var(--tx3)">—</td>
          <td class="r" style="color:var(--tx3)">—</td>
          <td class="r" style="color:var(--tx3)">—</td>
          <td class="r" style="color:var(--tx3)">—</td>
        </tr>`;

        alternantsActifs.forEach(alt=>{
          let pPrev=alt.p25||0;
          let pCurr=0;const pmCurr=new Array(12).fill(0);
          for(const m of getResultMonths(year)){pmCurr[m]=getAlternantTotalPrimeMois(cn,comp,alt,m,year);pCurr+=pmCurr[m];}
          if(year>2025){pPrev=0;for(const m of getResultMonths(year-1)){pPrev+=getAlternantTotalPrimeMois(cn,comp,alt,m,year-1);}}
          const moisSaisis=pmCurr.filter(p=>p>0).length;
          const d=pCurr-pPrev;
          const cl=d>0?'var(--red)':d<0?'var(--grn)':'var(--tx3)';
          const ar=d>0?'▲':d<0?'▼':'';

          h+=`<tr>
            <td style="padding:7px 12px 7px 32px;font-size:12px">${alt.nom} <span class="badge-alt">ALT</span></td>
            <td style="font-size:11px;color:#166534">Multi-magasins</td>
            <td class="r" style="color:var(--tx3)">${fmtE(pPrev)}</td>
            <td class="r" style="color:var(--tx3)">${moisSaisis}/12</td>
            <td class="r" style="font-weight:800">${fmtE(pCurr)}</td>
            <td class="r" style="font-weight:600;color:${cl}">${ar+' '+fmtE(Math.abs(d))}</td>
          </tr>`;
        });
      }
    }
    // ═══════════════════════════════════════════════════════════════
    h+=`<tr style="background:#0f172a;color:#fff;font-weight:800">
      <td colspan="2" style="padding:10px 12px 10px 16px">TOTAL ${cn.toUpperCase()}</td>
      <td class="r">${fmtE(sd.total25)}</td><td></td>
      <td class="r" style="font-size:14px">${fmtE(sd.total26)}</td>
      <td class="r" style="color:${ecart>=0?'#f87171':'#86efac'}">${ecart>=0?'▲':'▼'} ${fmtE(Math.abs(ecart))}</td>
    </tr></tbody></table></div>`;
    
    // Ajouter section vendeurs partis (comp déjà déclaré ligne 1014)
    if(comp){
      const partisHTML = renderPartisSection(comp, cn, year);
      if(partisHTML){
        h += partisHTML;
      }
    }
    
    h+='</div>';
  }
  return h;}

// ── Vue mensuelle RH : onglets par société + filtre de recherche ──

  const socNames=Object.keys(socData);
  const selSoc=S.rhSocTab||'all';
  const srch=(S.recapSearch||'').toLowerCase().trim();

  // Onglets sociétés
  let h=`<div class="rh-tabs">
    <button class="rh-tab ${selSoc==='all'?'all-on':''}" onclick="S.rhSocTab='all';render()">🌐 Toutes</button>
    ${socNames.map(cn=>`<button class="rh-tab ${selSoc===cn?'on':''}" onclick="S.rhSocTab='${esc(cn)}';render()">${cn}</button>`).join('')}
  </div>`;

  // Barre recherche locale RH
  h+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
    <div class="gsearch-wrap" style="max-width:320px">
      <input class="gsearch-input" placeholder="Filtrer vendeur, magasin..." value="${esc(S.recapSearch||'')}"
        oninput="S.recapSearch=this.value;renderRhBody()"/>
    </div>
    ${srch?`<button class="gsearch-clear" onclick="S.recapSearch='';render()">✕ Effacer</button>
    <span class="gsearch-hits">Filtre actif : <b>${srch}</b></span>`:''}
  </div>`;

  // Sociétés à afficher
  const toShow=selSoc==='all'?socNames:[selSoc];

  h+=`<div id="rh-body">${buildRhBody(socData,year,moisSel,toShow,srch)}</div>`;

  // Grand total mensuel (toujours toutes sociétés)
  h+=`<div style="background:linear-gradient(90deg,#1e3a5f,#1e293b);border-radius:14px;padding:14px 20px;margin-bottom:16px;overflow-x:auto">
    <div style="font-size:11px;font-weight:800;color:#93c5fd;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">GRAND TOTAL MENSUEL — toutes sociétés</div>
    <div style="display:flex;gap:6px;flex-wrap:nowrap;min-width:max-content">
      ${grandMois.map((p,i)=>`<div style="background:${i===moisSel?'#3b82f6':'#ffffff14'};border-radius:10px;padding:8px 12px;text-align:center;min-width:80px;cursor:pointer;border:${i===moisSel?'1px solid #60a5fa':'1px solid transparent'}" onclick="S.recapMois=${i};render()">
        <div style="font-size:9px;font-weight:700;color:${i===moisSel?'#fff':'rgba(255,255,255,.4)'};text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${MS[i]}</div>
        <div style="font-size:14px;font-weight:800;color:${i===moisSel?'#fff':p>0?'#e2e8f0':'rgba(255,255,255,.25)'}">${p>0?fmtE(p):'—'}</div>
      </div>`).join('')}
      <div style="background:#ffffff22;border-radius:10px;padding:8px 14px;text-align:center;min-width:90px;border:1px solid #ffffff33">
        <div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">TOTAL ${year}</div>
        <div style="font-size:15px;font-weight:800;color:#fff">${fmtE(grandMois.reduce((s,v)=>s+v,0))}</div>
      </div>
    </div>
  </div>`;

  return h;
}

function buildRhBody(socData,year,moisSel,toShow,srch){
  let h='';
  for(const cn of toShow){
    const sd=socData[cn];if(!sd)continue;
    const totalMoisSoc=sd.primesParMois[moisSel];

    // Filtrage vendeurs selon recherche
    const magsFiltered=sd.magasins.map(md=>{
      const vActifs=md.vendeurs.filter(v=>!v.parti&&(!srch||v.nom.toLowerCase().includes(srch)||md.nom.toLowerCase().includes(srch)||cn.toLowerCase().includes(srch)));
      const vPartis=md.vendeurs.filter(v=>v.parti&&(!srch||v.nom.toLowerCase().includes(srch)));
      return{...md,vActifs,vPartis,visible:vActifs.length>0||vPartis.length>0};
    }).filter(md=>md.visible);

    if(magsFiltered.length===0){
      h+=`<div style="padding:16px;color:var(--tx3);font-size:13px;text-align:center;background:var(--card);border-radius:12px;margin-bottom:10px">Aucun vendeur trouvé pour « ${srch} » dans ${cn}</div>`;
      continue;}

    h+=`<div class="mag" style="margin-bottom:14px">
      <div class="mag-h" style="background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff">
        <div>
          <div style="font-size:9px;text-transform:uppercase;letter-spacing:2px;opacity:.4;margin-bottom:2px">Fiches de paie — ${M[moisSel]} 2026</div>
          <div style="font-weight:800;font-size:16px">${cn}</div>
          <div style="font-size:10px;opacity:.5;margin-top:2px">👤 ${sd.manager||'—'} · ${sd.nVend} vendeur(s) actif(s)</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div style="background:#3b82f622;border:1px solid #3b82f644;border-radius:10px;padding:8px 14px;text-align:center">
            <div style="font-size:9px;opacity:.6;text-transform:uppercase;letter-spacing:1px">${M[moisSel]} 2026</div>
            <div style="font-size:20px;font-weight:800">${fmtE(totalMoisSoc)}</div>
          </div>
          <div style="background:#ffffff12;border-radius:10px;padding:8px 14px;text-align:center">
            <div style="font-size:9px;opacity:.4;text-transform:uppercase;letter-spacing:1px">Annuel simulé</div>
            <div style="font-size:17px;font-weight:800">${fmtE(sd.total26)}</div>
          </div>
        </div>
      </div>
      <div style="overflow-x:auto"><table class="rtbl">
        <thead><tr style="background:#f8fafc">
          <th style="padding-left:16px;min-width:180px;position:sticky;left:0;background:#f8fafc;z-index:1">Vendeur</th>
          <th style="min-width:130px">Magasin</th>
          ${MS.map((m,i)=>`<th class="r" style="min-width:72px;white-space:nowrap;${i===moisSel?'background:#eff6ff;color:var(--blu);font-weight:800':''}">${m}</th>`).join('')}
          <th class="r" style="min-width:90px;background:#f1f5f9;position:sticky;right:0">Total 2026</th>
        </tr></thead>
        <tbody>`;

    for(const md of magsFiltered){
      // Afficher directement les vendeurs actifs sans ligne de magasin
      md.vActifs.forEach(v=>{
        const nom=srch?v.nom.replace(new RegExp(srch.replace(/[-[\]/{}()*+?.,\\^$|#\s]/g,'\\$&'),'gi'),m=>`<mark class="gsearch-hit">${m}</mark>`):v.nom;
        h+=`<tr>
          <td style="padding:7px 12px 7px 16px;font-size:12px;font-weight:600;position:sticky;left:0;background:#fff">${nom} <span class="badge-fixe">FIXE</span></td>
          <td style="font-size:11px;color:var(--tx3)">${md.nom}</td>
          ${v.pm.map((p,i)=>`<td class="r" style="font-size:12px;font-weight:${p>0?'700':'400'};color:${p>0?'var(--grn)':'var(--tx3)'};${i===moisSel?'background:#eff6ff;':''}">${p>0?fmtE(p):'—'}</td>`).join('')}
          <td class="r" style="font-weight:800;background:#f8fafc;position:sticky;right:0">${fmtE(v.p26)}</td>
        </tr>`;
      });
    }
    
    // ══ AJOUTER LES VOLANTS ACTIFS UNIQUEMENT ══════════════════════════════════════════
    const comp=S.data.companies[cn];
    if(comp&&comp.volants&&comp.volants.length>0){
      const volantsActifs=comp.volants.filter(v=>!v.parti&&(!srch||v.nom.toLowerCase().includes(srch)||cn.toLowerCase().includes(srch)));
      
      if(volantsActifs.length>0){
        volantsActifs.forEach(vl=>{
          const nom=srch?vl.nom.replace(new RegExp(srch.replace(/[-[\]/{}()*+?.,\\^$|#\s]/g,'\\$&'),'gi'),m=>`<mark class="gsearch-hit">${m}</mark>`):vl.nom;
          const pm=new Array(12).fill(0);
          let totalVolant=0;
          for(let m=0;m<12;m++){
            pm[m]=getVolantTotalPrimeMois(cn,comp,vl,m,year);
            totalVolant+=pm[m];
          }
          h+=`<tr>
            <td style="padding:7px 12px 7px 24px;font-size:12px;font-weight:600;position:sticky;left:0;background:#fff">${nom} <span class="badge-vol">VOLANT</span></td>
            <td style="font-size:11px;color:var(--vol)">Multi-magasins</td>
            ${pm.map((p,i)=>`<td class="r" style="font-size:12px;font-weight:${p>0?'700':'400'};color:${p>0?'var(--vol)':'var(--tx3)'};${i===moisSel?'background:#eff6ff;':''}">${p>0?fmtE(p):'—'}</td>`).join('')}
            <td class="r" style="font-weight:800;background:#f8fafc;position:sticky;right:0">${fmtE(totalVolant)}</td>
          </tr>`;
        });
      }
    }
    // ═══════════════════════════════════════════════════════════════

    h+=`<tr style="background:#0f172a;color:#fff;font-weight:800">
      <td colspan="2" style="padding:10px 12px 10px 14px;font-size:12px">TOTAL ${cn.toUpperCase()}</td>
      ${sd.primesParMois.map((p,i)=>`<td class="r" style="${i===moisSel?'color:#93c5fd;':''}font-size:12px">${p>0?fmtE(p):'—'}</td>`).join('')}
      <td class="r" style="font-size:14px">${fmtE(sd.total26)}</td>
    </tr></tbody></table></div></div>`;}
  return h;
}

// Live update RH body without full re-render
window.renderRhBody=function(){
  const body=document.getElementById('rh-body');if(!body){render();return;}
  // Recompute socData quickly
  const year=S.selectedYear||2025;
  const resultMonths=getResultMonths(year);
  const socData={};const grandMois=new Array(12).fill(0);
  for(const[cn,comp]of Object.entries(S.data.companies)){
    const sd={name:cn,manager:comp.manager||'',magasins:[],total25:0,total26:0,primesParMois:new Array(12).fill(0),nVend:0,nParti:0};
    for(const mag of comp.magasins){
      const ca25=mag.totalCA2025||100000;
      const nActifs=mag.vendeurs.filter(v=>isActiveInMonth(v.dateParti,S.selectedYear,S.mois)).length||1;
      const md={nom:mag.nom,manager:mag.manager||comp.manager||'',ca25,vendeurs:[],total25:0,total26:0,primesParMois:new Array(12).fill(0)};
      for(const v of mag.vendeurs){
        let tp=0,tpReel=0;const pm=new Array(12).fill(0);
        for(const m of resultMonths){const ca=v.caSaisie?.[m]??v.caSheetAuto?.[m];if(ca==null)continue;
          const formuleMois=getFormuleMois(comp,year,m,mag);const augm=(formuleMois.augmentation!=null?formuleMois.augmentation:2);
          const obj=v.objManuel?.[m]??v.objSheetAuto?.[m]??calcObj(ca25,augm,m);
          const primeMagRH=calcPrime((ca/obj)*100,getPaliersMois(comp,m));const pr=primeMagRH;tp+=pr;pm[m]=pr;if(year===2026&&m>=3)tpReel+=pr;else if(year!==2026)tpReel=tp;}
        const p26=year===2026?tpReel:tp;
        md.vendeurs.push({nom:v.nom,p25:v.p25||0,p26:p26,pm,months:0,parti:!!v.parti});
        if(!v.parti){md.total26+=p26;for(let m=0;m<12;m++)md.primesParMois[m]+=pm[m];}
        sd.nVend+=(v.parti?0:1);}
      sd.magasins.push(md);}
    
    // ══ AJOUTER LES VOLANTS ══════════════════════════════════════════
    for(const vl of (comp.volants||[])){
      sd.total25+=(vl.p25||0);
      if(!vl.parti){
        let p26=0,p26Reel=0;for(const m of resultMonths){const pm=getVolantTotalPrimeMois(cn,comp,vl,m,year);p26+=pm;if(year===2026&&m>=3)p26Reel+=pm;else if(year!==2026)p26Reel=p26;}
        sd.total26+=(year===2026?p26Reel:p26);
      }
    }
    // ══ AJOUTER LES ALTERNANTS ═══════════════════════════════════════════
    for(const alt of (comp.alternants||[])){
      sd.total25+=(alt.p25||0);
      if(!alt.parti){
        let p26=0,p26Reel=0;for(const m of resultMonths){const pm=getAlternantTotalPrimeMois(cn,comp,alt,m,year);p26+=pm;if(year===2026&&m>=3)p26Reel+=pm;else if(year!==2026)p26Reel=p26;}
        sd.total26+=(year===2026?p26Reel:p26);
      }
    }
    // ═════════════════════════════════════════════════════════════════════

    socData[cn]=sd;}
  const moisSel=S.recapMois??0;
  const selSoc=S.rhSocTab||'all';
  const toShow=selSoc==='all'?Object.keys(socData):[selSoc];
  const srch=(S.recapSearch||'').toLowerCase().trim();
  body.innerHTML=buildRhBody(socData,year,moisSel,toShow,srch);
};
