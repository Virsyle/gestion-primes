<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des Primes 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--brd:#e2e8f0;--tx:#1e293b;--tx2:#64748b;--tx3:#94a3b8;--acc:#3b82f6;--grn:#16a34a;--red:#dc2626;--org:#ea580c;--blu:#2563eb;--vol:#7c3aed;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}
.container{max-width:1400px;margin:0 auto;padding:16px;}
button{cursor:pointer;}input,select{outline:none;font-family:inherit;}

.login-screen{display:flex;align-items:center;justify-content:center;min-height:90vh;}
.login-box{background:var(--card);border-radius:24px;padding:48px;text-align:center;max-width:420px;width:100%;box-shadow:0 4px 24px #0001;}
.login-box h1{font-size:24px;font-weight:800;margin-bottom:4px;}
.login-box p{color:var(--tx2);font-size:12px;margin-bottom:24px;}
.login-input{width:100%;padding:12px 16px;border:2px solid var(--brd);border-radius:12px;font-size:14px;margin-bottom:12px;text-align:center;}
.login-input:focus{border-color:var(--acc);}
.login-btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--tx);color:#fff;font-size:14px;font-weight:700;margin-bottom:16px;}
.login-btn:hover{background:#334155;}.login-btn:disabled{opacity:.5;cursor:wait;}
.login-error{color:var(--red);font-size:12px;margin-bottom:8px;}
.login-setup{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px;text-align:left;font-size:11px;color:#92400e;line-height:1.6;margin-top:12px;}
.login-setup strong{display:block;margin-bottom:4px;}
.login-setup input{width:100%;padding:6px 10px;border:1px solid #fde68a;border-radius:6px;font-size:11px;margin-top:6px;}

.header{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:18px;padding:18px 24px;margin-bottom:16px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.header h1{font-size:20px;font-weight:800;letter-spacing:-.5px;}
.header-sub{font-size:10px;opacity:.5;margin-top:2px;}
.hdr-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.hdr-stat{background:#ffffff12;border-radius:10px;padding:6px 14px;text-align:center;}
.hdr-stat small{font-size:8px;opacity:.4;text-transform:uppercase;letter-spacing:1px;display:block;}
.hdr-stat b{font-size:14px;}
.btn{padding:8px 16px;border-radius:8px;font-size:11px;font-weight:700;border:none;}
.btn-grn{background:#10b981;color:#fff;}.btn-grn:hover{background:#059669;}
.btn-ghost{background:none;border:1px solid #ffffff33;color:#fff;opacity:.7;font-weight:600;}.btn-ghost:hover{opacity:1;}
.btn-sm{padding:5px 11px;font-size:10px;border-radius:6px;}
.btn-danger{background:none;border:1px solid #fca5a5;color:var(--red);font-weight:600;}
.btn-parti{background:none;border:1px solid #fed7aa;color:#c2410c;font-weight:600;font-size:10px;padding:4px 10px;border-radius:6px;}
.btn-parti:hover{background:#fff7ed;}
.btn-revenir{background:none;border:1px solid #bbf7d0;color:#15803d;font-weight:600;font-size:10px;padding:4px 10px;border-radius:6px;}
.btn-revenir:hover{background:#f0fdf4;}

.warn{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 16px;margin-bottom:12px;font-size:11px;color:#92400e;display:flex;align-items:center;gap:8px;}
.loading{text-align:center;padding:60px;color:var(--tx3);}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}

.nav-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
.tab{padding:8px 16px;border-radius:10px;border:none;background:var(--card);color:var(--tx2);font-weight:700;font-size:11px;transition:all .15s;}
.tab.on{background:var(--tx);color:#fff;box-shadow:0 3px 10px #1e293b44;}
.tab.vol-on{background:var(--vol);color:#fff;box-shadow:0 3px 10px #7c3aed44;}

.cfg{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--brd);}
.cfg-title{font-weight:800;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.cfg-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;}
.plr{background:#f8fafc;border:1px solid var(--brd);border-radius:10px;padding:10px 14px;flex:1;min-width:180px;position:relative;}
.plr-label{font-size:9px;color:var(--tx3);font-weight:700;text-transform:uppercase;margin-bottom:6px;}
.plr-r{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.plr-r label{font-size:10px;color:var(--tx3);width:44px;flex-shrink:0;}
.plr-r input{width:52px;padding:4px;border:1px solid var(--brd);border-radius:6px;font-size:12px;text-align:center;font-weight:700;}
.plr-r select{padding:4px 6px;border:1px solid var(--brd);border-radius:6px;font-size:11px;font-weight:600;background:#fff;color:var(--tx);flex:1;}
.plr-r span{font-size:11px;color:var(--tx3);}
.plr-del{position:absolute;top:4px;right:6px;background:none;border:none;color:var(--tx3);font-size:16px;}
.plr-add{background:#f8fafc;border:2px dashed var(--brd);border-radius:10px;padding:12px 10px;color:var(--tx3);font-size:18px;min-width:50px;display:flex;align-items:center;justify-content:center;align-self:stretch;}
.plr-add:hover{border-color:var(--acc);color:var(--acc);}
.aug{display:flex;align-items:center;gap:6px;}
.aug label{font-size:11px;color:var(--tx2);}
.aug input{width:50px;padding:4px 6px;border:1px solid var(--brd);border-radius:6px;font-size:12px;text-align:center;font-weight:700;}

.mgr-row{display:flex;align-items:center;gap:8px;}
.mgr-row label{font-size:11px;color:var(--tx2);font-weight:700;white-space:nowrap;}
.mgr-input{padding:7px 12px;border:1px solid var(--brd);border-radius:8px;font-size:12px;font-weight:600;width:210px;}
.mgr-input:focus{border-color:var(--acc);}

.formule-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px 16px;margin-bottom:12px;}
.formule-title{font-weight:700;font-size:12px;color:#0369a1;margin-bottom:8px;}
.formule-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.formule-row label{font-size:11px;color:#0369a1;}
.formule-row input{width:50px;padding:4px;border:1px solid #bae6fd;border-radius:6px;font-size:12px;text-align:center;font-weight:700;}

.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.st{border-radius:12px;padding:10px 16px;flex:1;min-width:90px;}
.st-dark{background:var(--tx);color:#fff;}
.st small{font-size:9px;text-transform:uppercase;opacity:.5;display:block;}
.st b{font-size:18px;font-weight:800;display:block;}
.st span{font-size:10px;opacity:.5;}

.mbar{display:flex;gap:3px;margin-bottom:12px;flex-wrap:wrap;}
.mt{padding:5px 9px;border-radius:7px;border:none;font-size:10px;font-weight:600;background:var(--card);color:var(--tx3);}
.mt.on{background:var(--tx);color:#fff;}

.mag{background:var(--card);border-radius:14px;margin-bottom:10px;border:1px solid var(--brd);overflow:hidden;}
.mag-h{padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.mag-name{font-weight:800;font-size:14px;}
.mag-sub{font-size:10px;color:var(--tx3);}
.vend{padding:10px 16px;border-bottom:1px solid #f8fafc;}
.vend.parti-vend{opacity:.55;background:#fff8f8;}
.vend-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.vend-name{font-weight:700;font-size:12px;}
.vend-total{font-size:11px;font-weight:800;background:#f1f5f9;padding:2px 10px;border-radius:20px;}
.mgrid{display:flex;gap:4px;flex-wrap:wrap;}
.mc{border-radius:8px;padding:6px;border:1px solid var(--brd);min-width:68px;flex:1;}
.mc.wide{min-width:200px;flex:0 0 200px;}
.mc-lbl{font-size:9px;color:var(--tx3);font-weight:700;margin-bottom:2px;}
.mc-obj{font-size:9px;color:var(--tx3);}
.mc input{width:100%;padding:3px 4px;border:1px solid var(--brd);border-radius:5px;font-size:11px;font-weight:600;margin-top:2px;}
.mc-res{margin-top:2px;display:flex;justify-content:space-between;font-size:10px;font-weight:700;}
.mc.bg-g{background:#f0fdf4;}.mc.bg-b{background:#eff6ff;}.mc.bg-o{background:#fff7ed;}.mc.bg-r{background:#fef2f2;}
.tx-g{color:var(--grn);}.tx-b{color:var(--blu);}.tx-o{color:var(--org);}.tx-r{color:var(--red);}

.badge-fixe{background:#eff6ff;color:var(--blu);font-size:9px;font-weight:800;padding:1px 7px;border-radius:20px;border:1px solid #bfdbfe;}
.badge-vol{background:#f5f3ff;color:var(--vol);font-size:9px;font-weight:800;padding:1px 7px;border-radius:20px;border:1px solid #ddd6fe;}
.badge-parti{background:#fef2f2;color:var(--red);font-size:9px;font-weight:800;padding:1px 7px;border-radius:20px;border:1px solid #fca5a5;}
.vend-name-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

.vol-section{background:#faf5ff;border:1px solid #ddd6fe;border-radius:14px;padding:16px;margin-bottom:12px;}
.vol-section-hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.vol-section-title{font-weight:800;font-size:13px;color:var(--vol);}
.vol-section-desc{font-size:11px;color:#6d28d9;margin-bottom:12px;opacity:.7;}
.vol-chips{display:flex;flex-wrap:wrap;margin-bottom:10px;}
.vol-chip{background:#fff;border-radius:8px;padding:6px 12px;font-size:11px;border:1px solid #ddd6fe;display:inline-flex;align-items:center;gap:6px;margin:3px;}
.vol-assign-tbl{background:#fff;border:1px solid #ddd6fe;border-radius:10px;overflow:hidden;margin-top:10px;}
.vol-assign-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f5f3ff;flex-wrap:wrap;}
.vol-assign-row:last-child{border-bottom:none;}
.vol-assign-mag{font-size:11px;font-weight:700;min-width:150px;}
.va-item{display:flex;align-items:center;gap:4px;font-size:10px;background:#f5f3ff;padding:3px 8px;border-radius:6px;}
.va-item input{width:34px;padding:2px 4px;border:1px solid #ddd6fe;border-radius:4px;font-size:10px;text-align:center;background:#fff;}

.p25-bar{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:14px;padding:16px;margin-bottom:12px;color:#fff;}
.p25-bar-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.4;margin-bottom:12px;}
.p25-cards{display:flex;gap:8px;flex-wrap:wrap;}
.p25-card{background:#ffffff12;border-radius:10px;padding:10px 16px;flex:1;min-width:110px;}
.p25-card small{font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:2px;}
.p25-card b{font-size:16px;font-weight:800;}
.p25-card sub{font-size:10px;opacity:.5;display:block;margin-top:2px;}
.p25-card-total{background:#3b82f620;border:1px solid #3b82f640;}

.list-panel{background:var(--card);border-radius:14px;margin-bottom:12px;border:1px solid var(--brd);overflow:hidden;}
.list-ph{padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.list-ph-title{font-weight:800;font-size:14px;}
.list-ph-sub{font-size:11px;color:var(--tx3);margin-top:2px;}
.search-wrap{position:relative;min-width:200px;flex:1;max-width:340px;}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--brd);border-radius:10px;font-size:12px;}
.search-wrap::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;}
.fbtn-row{display:flex;gap:4px;flex-wrap:wrap;}
.fbtn{padding:5px 12px;border-radius:7px;border:1px solid var(--brd);font-size:10px;font-weight:700;background:#f8fafc;color:var(--tx2);}
.fbtn.on{background:var(--tx);color:#fff;border-color:var(--tx);}
.fbtn.vol-on{background:var(--vol);color:#fff;border-color:var(--vol);}

.vrow{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #f1f5f9;transition:background .1s;gap:8px;}
.vrow:hover{background:#f8fafc;}
.vrow.parti-row{opacity:.6;background:#fff8f8;}
.vrow-left{display:flex;align-items:center;gap:10px;min-width:0;}
.vrow-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:var(--tx);color:#fff;}
.vrow-av.vol{background:var(--vol);}
.vrow-av.parti{background:#fca5a5;color:#7f1d1d;}
.vrow-info{line-height:1.5;min-width:0;}
.vrow-nom{font-weight:700;font-size:13px;}
.vrow-meta{font-size:10px;color:var(--tx3);}
.vrow-meta2{font-size:10px;color:var(--vol);margin-top:1px;}
.vrow-right{display:flex;align-items:center;gap:10px;flex-shrink:0;text-align:right;}
.list-empty{padding:40px;text-align:center;color:var(--tx3);font-size:13px;}

.mag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:16px;}
.mag-card{background:#f8fafc;border:1px solid var(--brd);border-radius:12px;padding:12px 14px;}
.mag-card-name{font-weight:800;font-size:13px;margin-bottom:3px;}
.mag-card-mgr{font-size:11px;color:var(--tx2);margin-bottom:8px;}
.mag-card-stats{display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--tx3);margin-bottom:8px;}
.mag-card-stat{background:#fff;border-radius:6px;padding:2px 8px;border:1px solid var(--brd);}
.mag-card-btns{display:flex;gap:6px;}

.rtbl{width:100%;border-collapse:collapse;}
.rtbl th{padding:8px 12px;text-align:left;font-size:10px;color:var(--tx2);background:#f8fafc;white-space:nowrap;}
.rtbl td{padding:8px 12px;font-size:12px;border-bottom:1px solid #f1f5f9;}
.rtbl .r{text-align:right;}
.rtbl tr:hover td{background:#f8fafc;}

/* GLOBAL SEARCH BAR */
.gsearch-bar{background:var(--card);border-radius:14px;padding:10px 16px;margin-bottom:12px;border:1px solid var(--brd);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.gsearch-input{flex:1;min-width:220px;padding:9px 14px 9px 36px;border:2px solid var(--brd);border-radius:10px;font-size:13px;font-family:inherit;transition:border-color .15s;}
.gsearch-input:focus{border-color:var(--acc);outline:none;}
.gsearch-wrap{position:relative;flex:1;min-width:220px;}
.gsearch-wrap::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
.gsearch-hits{font-size:11px;color:var(--tx3);}
.gsearch-hit{background:#fef9c3;border-radius:2px;font-weight:700;color:#92400e;}
.gsearch-clear{padding:6px 12px;border-radius:8px;border:1px solid var(--brd);background:#f8fafc;color:var(--tx2);font-size:11px;font-weight:700;}
.gsearch-clear:hover{background:#f1f5f9;}
.gsearch-result{padding:7px 10px;border-radius:8px;background:#f8fafc;border:1px solid var(--brd);font-size:12px;font-weight:600;cursor:pointer;transition:background .1s;}
.gsearch-result:hover{background:#eff6ff;border-color:#bfdbfe;}

/* RH SOCIETY TABS */
.rh-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;}
.rh-tab{padding:7px 16px;border-radius:10px;border:none;background:var(--card);color:var(--tx2);font-weight:700;font-size:11px;transition:all .15s;border:1px solid var(--brd);}
.rh-tab.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 10px #3b82f644;}
.rh-tab.all-on{background:var(--tx);color:#fff;border-color:var(--tx);}

.footer{text-align:center;padding:16px;font-size:10px;color:var(--tx3);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--tx);color:#fff;padding:10px 20px;border-radius:10px;font-size:12px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

.modal-bg{position:fixed;inset:0;background:#00000055;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:var(--card);border-radius:16px;padding:24px;max-width:500px;width:100%;box-shadow:0 8px 40px #0004;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:16px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--tx2);margin-bottom:16px;}
.modal label{font-size:11px;font-weight:700;color:var(--tx2);display:block;margin-bottom:4px;margin-top:8px;}
.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--brd);border-radius:8px;font-size:13px;font-family:inherit;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
</style>
</head>
<body>
<div id="app" class="container"></div>
<div id="toast" class="toast"></div>
<script>
let API_URL=localStorage.getItem('primes_api_url')||'';
const M=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MS=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const SAISON=[.083,.078,.086,.086,.085,.084,.092,.091,.082,.086,.079,.089];
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('fr-FR');
const fmtE=n=>n==null?'—':fmt(n)+' €';
const calcObj=(ca,aug,m)=>Math.round(ca*(1+(aug/100))*SAISON[m]);
const OPS=[{val:'>=',label:'≥ supérieur ou égal',short:'≥'},{val:'<=',label:'≤ inférieur ou égal',short:'≤'},{val:'>',label:'> strictement supérieur',short:'>'},{val:'<',label:'< strictement inférieur',short:'<'}];

function calcPrime(t,pal){
  if(t==null)return 0;let r=0;
  const s=[...pal].sort((a,b)=>b.seuil-a.seuil);
  for(const x of s){const op=x.operateur||'>=';let ok=false;
    if(op==='>=')ok=t>=x.seuil;else if(op==='<=')ok=t<=x.seuil;else if(op==='>')ok=t>x.seuil;else ok=t<x.seuil;
    if(ok){r=x.prime;break;}}return r;}
function tc(t){if(t==null)return'';if(t>=110)return'g';if(t>=100)return'b';if(t>=95)return'o';return'r';}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function ini(n){return(n||'').split(' ').map(w=>w[0]||'').join('').substring(0,2).toUpperCase()||'?';}

let S={phase:'login',password:'',data:null,activeComp:'',mois:'all',view:'gestion',loading:false,modal:null,volantJours:[],
  fixSearch:'',fixFilter:'all',volSearch:'',volFilter:'all',subTab:'fixes',
  recapMode:'annuel',recapMois:0,rhSocTab:'all',globalSearch:'',recapSearch:''};


// ══════ GLOBAL SEARCH ══════
function renderGlobalSearch(){
  const q=(S.globalSearch||'').trim();
  if(!q)return`<div class="gsearch-bar">
    <span style="font-size:14px">🔍</span>
    <div class="gsearch-wrap"><input class="gsearch-input" placeholder="Rechercher vendeur, magasin, société, manager sur tout le site..."
      value="${esc(S.globalSearch)}" oninput="S.globalSearch=this.value;renderGlobalResults()"/></div>
    <span class="gsearch-hits" style="opacity:.5">Recherche globale dans toutes les données</span>
    <div id="gsearch-results" style="display:none"></div>
  </div>`;

  // Compute results
  const results=[];
  for(const[cn,comp]of Object.entries(S.data.companies)){
    const mgr=comp.manager||'';
    for(const mag of comp.magasins){
      const magMgr=mag.manager||mgr;
      for(const v of mag.vendeurs){
        const fields=[v.nom,cn,mag.nom,magMgr].join(' ').toLowerCase();
        if(fields.includes(q.toLowerCase()))results.push({type:'vendeur',nom:v.nom,societe:cn,magasin:mag.nom,manager:magMgr,parti:!!v.parti});
      }
    }
    for(const v of (comp.volants||[])){
      const fields=[v.nom,cn,mgr].join(' ').toLowerCase();
      if(fields.includes(q.toLowerCase()))results.push({type:'volant',nom:v.nom,societe:cn,manager:mgr,parti:!!v.parti});
    }
    if([cn,mgr].join(' ').toLowerCase().includes(q.toLowerCase())){

async function api(action,params={}){
  const url=new URL(API_URL);url.searchParams.set('action',action);url.searchParams.set('password',S.password);
  for(const[k,v]of Object.entries(params))url.searchParams.set(k,typeof v==='object'?JSON.stringify(v):String(v));
  const res=await fetch(url.toString());const json=await res.json();
  if(json.error)throw new Error(json.error);return json;}

  </div>`;}

function renderStats(comp){
  let total=0,sous=0,count=0,sansCA=0;const pc={};(comp.paliers||[]).forEach((_,i)=>pc[i]=0);
  
  // Filtrer par mois sélectionné
  const selectedMois = S.mois === 'all' ? null : parseInt(S.mois);
  const moisToCheck = selectedMois !== null ? [selectedMois] : [...Array(12).keys()];
  
  // Compter tous les vendeurs actifs pour vérifier qui n'a pas de CA
  const allVendeurs = new Set();
  
  for(const mag of comp.magasins){
    const ca25=mag.totalCA2025||100000;
    for(const v of mag.vendeurs){
      if(v.parti)continue;
      allVendeurs.add(v.nom);
      
      let hasCA = false;
      for(const m of moisToCheck){
        const ca=v.caSaisie?.[m]??v.caSheet?.[m];
        if(ca!=null){
          hasCA = true;
          count++;
          const obj=v.objManuel?.[m]||v.objSheet?.[m]||calcObj(ca25,comp.augmentation||2,m);
          const t=(ca/obj)*100;const pr=calcPrime(t,comp.paliers||[]);total+=pr;
          let matched=false;
          for(let pi=(comp.paliers||[]).length-1;pi>=0;pi--){
            const pp=(comp.paliers||[])[pi];const op=pp.operateur||'>=';
            let ok=false;if(op==='>=')ok=t>=pp.seuil;else if(op==='<=')ok=t<=pp.seuil;else if(op==='>')ok=t>pp.seuil;else ok=t<pp.seuil;
            if(ok){pc[pi]++;matched=true;break;}}
          if(!matched)sous++;
        }
      }
      if(!hasCA)sansCA++;
    }
  }
  
  const totV=comp.magasins.reduce((s,m)=>s+m.vendeurs.filter(v=>!v.parti).length,0);
  const totVol=(comp.volants||[]).filter(v=>!v.parti).length;
  
  // Enlever "X mois" du coût simulé
  let h=`<div class="stats">
    <div class="st st-dark"><small>Coût simulé</small><b>${fmtE(total)}</b></div>
    <div class="st" style="background:#eff6ff"><small style="color:#1d4ed8">Fixes actifs</small><b style="color:var(--blu)">${totV}</b></div>
    <div class="st" style="background:#f5f3ff"><small style="color:var(--vol)">Volants actifs</small><b style="color:var(--vol)">${totVol}</b></div>
    <div class="st" style="background:#fef2f2"><small style="color:#991b1b">Hors palier</small><b style="color:var(--red)">${sous}</b></div>
    <div class="st" style="background:#fffbeb"><small style="color:#92400e">Sans CA</small><b style="color:#b45309">${sansCA}</b></div>`;
  (comp.paliers||[]).forEach((p,i)=>{const op=p.operateur||'>=';const opS=OPS.find(o=>o.val===op)?.short||'≥';
    const bg=i===(comp.paliers||[]).length-1?'background:#f0fdf4':'background:#f8fafc';
    const cl=i===(comp.paliers||[]).length-1?'color:var(--grn)':'';
    h+=`<div class="st" style="${bg}"><small>${opS}${p.seuil}%</small><b style="${cl}">${pc[i]||0}</b><span>${p.prime}€</span></div>`;});
  return h+'</div>';}

function collectFixed(){
  const all=[];
  for(const[cn,comp]of Object.entries(S.data.companies)){
    for(const mag of comp.magasins){const ca25=mag.totalCA2025||100000;
      for(const v of mag.vendeurs){let tp=0;
        for(let m=0;m<12;m++){const ca=v.caSaisie?.[m]??v.caSheet?.[m];if(ca==null)continue;
          const obj=v.objManuel?.[m]||v.objSheet?.[m]||calcObj(ca25,comp.augmentation||2,m);tp+=calcPrime((ca/obj)*100,comp.paliers||[]);}
        all.push({nom:v.nom,societe:cn,magasin:mag.nom,manager:mag.manager||comp.manager||'',parti:!!v.parti,p26:tp,p25:v.p25||0});}}}
  return all;}

function filterSort(all,search,filter,isVol=false){
  let f=all.filter(v=>{
    if(filter==='actif'&&v.parti)return false;if(filter==='parti'&&!v.parti)return false;
    if(search)return v.nom.toLowerCase().includes(search)||v.societe.toLowerCase().includes(search)||(v.magasin||'').toLowerCase().includes(search)||(v.manager||'').toLowerCase().includes(search);
    return true;});
  f.sort((a,b)=>{if(a.parti&&!b.parti)return 1;if(!a.parti&&b.parti)return-1;return a.nom.localeCompare(b.nom,'fr');});
  return f;}

function buildFixRows(rows){
  if(!rows.length)return`<div class="list-empty">Aucun vendeur fixe trouvé.</div>`;

    return`<div class="vrow${v.parti?' parti-row':''}">
      <div class="vrow-left"><div class="vrow-av${v.parti?' parti':''}">${ini(v.nom)}</div>

      </div></div></div>`;}).join('');}

// ══════ RECAP PAR SOCIÉTÉ ══════
// Modes : 'annuel' = vue synthèse | 'mensuel' = vue RH mois par mois
// S.recapMode et S.recapMois pour navigation

function renderRecap(){
  // ── Calcul global avec données mensuelles ──
  const socData={};let g25=0,g26=0;
  const grandMois=new Array(12).fill(0);
  for(const[cn,comp]of Object.entries(S.data.companies)){
    const sd={name:cn,manager:comp.manager||'',magasins:[],
      total25:0,total26:0,primesParMois:new Array(12).fill(0),
      nVend:0,nParti:0,nVolants:(comp.volants||[]).filter(v=>!v.parti).length};
    for(const mag of comp.magasins){
      const ca25=mag.totalCA2025||100000;
      const md={nom:mag.nom,manager:mag.manager||comp.manager||'',ca25,vendeurs:[],total25:0,total26:0,primesParMois:new Array(12).fill(0)};
      for(const v of mag.vendeurs){
        let tp=0,mc=0;const pm=new Array(12).fill(0);
        for(let m=0;m<12;m++){const ca=v.caSaisie?.[m]??v.caSheet?.[m];if(ca==null)continue;mc++;
          const obj=v.objManuel?.[m]||v.objSheet?.[m]||calcObj(ca25,comp.augmentation||2,m);
          const pr=calcPrime((ca/obj)*100,comp.paliers||[]);tp+=pr;pm[m]=pr;}
        const p25=v.p25||0;
        md.vendeurs.push({nom:v.nom,p25,p26:tp,pm,months:mc,parti:!!v.parti});
        md.total25+=p25;if(!v.parti){md.total26+=tp;for(let m=0;m<12;m++)md.primesParMois[m]+=pm[m];}
        sd.total25+=p25;if(!v.parti){sd.total26+=tp;for(let m=0;m<12;m++)sd.primesParMois[m]+=pm[m];}
        sd.nVend+=(v.parti?0:1);sd.nParti+=(v.parti?1:0);
        g25+=p25;if(!v.parti){g26+=tp;for(let m=0;m<12;m++)grandMois[m]+=pm[m];}}
      sd.magasins.push(md);}
    
    // ══ AJOUTER LES PRIMES DES VOLANTS ═══════════════════════════════
    for(const vl of (comp.volants||[])){
      const p25=vl.p25||0;
      sd.total25+=p25;
      g25+=p25;
      // Calculer p26 des volants basé sur jours affectés (si non partis)
      if(!vl.parti){
        const vJours=(S.data.volantJours||[]).filter(vj=>vj.societe===cn&&vj.volant===vl.nom);
        const totalJours=vJours.reduce((s,vj)=>s+vj.jours,0);
        const p26=Math.round(p25*totalJours/240);
        sd.total26+=p26;
        g26+=p26;
      }
    }
    // ═══════════════════════════════════════════════════════════════════
    
    socData[cn]=sd;}

  const mode=S.recapMode||'annuel';
  const moisSel=S.recapMois??null; // null = tous, 0-11 = mois spécifique

  // ── Bandeau global (toujours affiché) ──
  let h=`<div class="p25-bar"><div class="p25-bar-title">Synthèse globale — toutes sociétés</div><div class="p25-cards">`;
  for(const sd of Object.values(socData)){
    const d=sd.total26-sd.total25;
    h+=`<div class="p25-card" style="cursor:pointer" onclick="document.getElementById('soc-${esc(sd.name)}')?.scrollIntoView({behavior:'smooth'})">
      <small>${sd.name}</small><b>${fmtE(sd.total25)}</b>
      <sub>2026 sim : ${fmtE(sd.total26)} <span style="color:${d>=0?'#f87171':'#86efac'}">${d>=0?'+':''}${fmtE(d)}</span></sub>
    </div>`;}
  h+=`<div class="p25-card p25-card-total"><small>🏆 Total 2025</small><b>${fmtE(g25)}</b>
    <sub>2026 sim : ${fmtE(g26)}</sub></div></div></div>`;

  // ── Sélecteur de mode ──
  h+=`<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
    <button class="tab ${mode==='annuel'?'on':''}" onclick="S.recapMode='annuel';render()">📊 Vue annuelle</button>
    <button class="tab ${mode==='mensuel'?'on':''}" onclick="S.recapMode='mensuel';S.recapMois=S.recapMois??0;render()">📅 Vue mensuelle RH</button>
    ${mode==='mensuel'?`<div style="display:flex;gap:3px;flex-wrap:wrap;margin-left:8px">
      ${MS.map((m,i)=>`<button class="mt ${moisSel===i?'on':''}" onclick="S.recapMois=${i};render()">${m}</button>`).join('')}
    </div>`:''}
  </div>`;
  
  // ── Onglets sociétés pour vue annuelle ──
  if(mode==='annuel'){
    const socNames=Object.keys(socData);
    const selSoc=S.recapAnnuelSoc||'all';
    h+=`<div class="rh-tabs">
      <button class="rh-tab ${selSoc==='all'?'all-on':''}" onclick="S.recapAnnuelSoc='all';render()">🌐 Toutes</button>
      ${socNames.map(cn=>`<button class="rh-tab ${selSoc===cn?'on':''}" onclick="S.recapAnnuelSoc='${esc(cn)}';render()">${cn}</button>`).join('')}
    </div>`;
  }

  if(mode==='annuel'){
    h+=renderRecapAnnuel(socData,g25,g26,S.recapAnnuelSoc||'all');
  } else {
    const mIdx=moisSel??0;
    h+=renderRecapMensuel(socData,mIdx,grandMois);
  }

  // ── Grand total bar ──
  const ge=g26-g25;
  h+=`<div style="background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:14px;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:#fff;margin-bottom:16px">
    <div style="font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:1px">🏆 Grand Total — Toutes sociétés</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div style="background:#ffffff12;border-radius:10px;padding:8px 20px;text-align:center">
        <div style="font-size:9px;opacity:.4;text-transform:uppercase;letter-spacing:1px">Total primes 2025</div>
        <div style="font-size:22px;font-weight:800">${fmtE(g25)}</div>
      </div>
      <div style="background:#ffffff12;border-radius:10px;padding:8px 20px;text-align:center">
        <div style="font-size:9px;opacity:.4;text-transform:uppercase;letter-spacing:1px">Total simulé 2026</div>
        <div style="font-size:22px;font-weight:800">${fmtE(g26)}</div>
      </div>
      <div style="background:${ge>=0?'#dc262622':'#16a34a22'};border:1px solid ${ge>=0?'#fca5a544':'#86efac44'};border-radius:10px;padding:8px 20px;text-align:center">
        <div style="font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:1px">Évolution</div>
        <div style="font-size:22px;font-weight:800;color:${ge>=0?'#f87171':'#86efac'}">${ge>=0?'▲':'▼'} ${fmtE(Math.abs(ge))}</div>
      </div>
    </div>
  </div>`;
  return h;
}

// ── Vue annuelle : un bloc par société, vendeurs en lignes, total annuel ──
function renderRecapAnnuel(socData,g25,g26,selectedSoc='all'){
  let h='';
  const societes = selectedSoc === 'all' ? Object.entries(socData) : [[selectedSoc, socData[selectedSoc]]].filter(([k,v])=>v);
  
  for(const[cn,sd]of societes){
    const ecart=sd.total26-sd.total25;
    h+=`<div class="mag" id="soc-${esc(cn)}" style="margin-bottom:16px">
      <div class="mag-h" style="background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff">
        <div>
          <div style="font-size:9px;text-transform:uppercase;letter-spacing:2px;opacity:.4;margin-bottom:2px">Société</div>
          <div style="font-weight:800;font-size:16px">${cn}</div>
          <div style="font-size:10px;opacity:.5;margin-top:2px">👤 ${sd.manager||'—'} · ${sd.magasins.length} magasin(s) · ${sd.nVend} actif(s)${sd.nParti?' · <span style="color:#fca5a5">'+sd.nParti+' parti(s)</span>':''} · ${sd.nVolants} volant(s)</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div style="background:#ffffff12;border-radius:10px;padding:8px 14px;text-align:center">
            <div style="font-size:9px;opacity:.4;text-transform:uppercase;letter-spacing:1px">Primes 2025</div>
            <div style="font-size:17px;font-weight:800">${fmtE(sd.total25)}</div>
          </div>
          <div style="background:#ffffff12;border-radius:10px;padding:8px 14px;text-align:center">
            <div style="font-size:9px;opacity:.4;text-transform:uppercase;letter-spacing:1px">Simulé 2026</div>
            <div style="font-size:17px;font-weight:800">${fmtE(sd.total26)}</div>
          </div>
          <div style="background:${ecart>=0?'#dc262622':'#16a34a22'};border:1px solid ${ecart>=0?'#fca5a544':'#86efac44'};border-radius:10px;padding:8px 14px;text-align:center">
            <div style="font-size:9px;opacity:.6;text-transform:uppercase;letter-spacing:1px">Écart</div>
            <div style="font-size:17px;font-weight:800;color:${ecart>=0?'#f87171':'#86efac'}">${ecart>=0?'▲':'▼'} ${fmtE(Math.abs(ecart))}</div>
          </div>
        </div>
      </div>
      <div style="overflow-x:auto"><table class="rtbl">
        <thead><tr style="background:#f8fafc">
          <th style="padding-left:16px">Magasin / Vendeur</th>
          <th>Manager</th>
          <th class="r">Primes 2025</th>
          <th class="r">Mois saisis</th>
          <th class="r">Simulé 2026</th>
          <th class="r">Écart</th>
        </tr></thead><tbody>`;
    for(const md of sd.magasins){
      const me=md.total26-md.total25;
      h+=`<tr style="background:#f1f5f9;font-weight:700">
        <td style="padding:8px 12px 8px 16px;font-size:12px">🏬 <b>${md.nom}</b> <span style="font-size:10px;color:var(--tx3);font-weight:400">CA réalisé : ${fmtE(md.ca25)}</span></td>
        <td style="font-size:11px;color:var(--tx2)">👤 ${md.manager||'—'}</td>
        <td class="r">${fmtE(md.total25)}</td><td class="r" style="color:var(--tx3)">—</td>
        <td class="r" style="font-weight:800">${fmtE(md.total26)}</td>
        <td class="r" style="color:${me>=0?'var(--red)':'var(--grn)'}">${me>=0?'▲':'▼'} ${fmtE(Math.abs(me))}</td>
      </tr>`;
      md.vendeurs.forEach(v=>{
        const d=v.p26-v.p25;const cl=d>0?'var(--red)':d<0?'var(--grn)':'var(--tx3)';const ar=d>0?'▲':d<0?'▼':'';
        h+=`<tr style="${v.parti?'opacity:.5;background:#fff8f8':''}">
          <td style="padding:7px 12px 7px 32px;font-size:12px">${v.nom} <span class="badge-fixe">FIXE</span>${v.parti?' <span class="badge-parti">PARTI</span>':''}</td>
          <td></td>
          <td class="r" style="color:var(--tx3)">${fmtE(v.p25)}</td>
          <td class="r" style="color:var(--tx3)">${v.months}/12</td>
          <td class="r" style="font-weight:800">${v.parti?'—':fmtE(v.p26)}</td>
          <td class="r" style="font-weight:600;color:${cl}">${v.parti?'—':ar+' '+fmtE(Math.abs(d))}</td>
        </tr>`;}); }
    
    // ══ AJOUTER LES VOLANTS ══════════════════════════════════════════
    const comp=S.data.companies[cn];
    if(comp&&comp.volants&&comp.volants.length>0){
      h+=`<tr style="background:#f5f3ff">
        <td colspan="2" style="padding:8px 12px 8px 16px;font-size:12px;font-weight:700;color:var(--vol)">🔄 <b>Vendeurs Volants</b></td>
        <td class="r" style="color:var(--tx3)">—</td>
        <td class="r" style="color:var(--tx3)">—</td>
        <td class="r" style="color:var(--tx3)">—</td>
        <td class="r" style="color:var(--tx3)">—</td>
      </tr>`;
      
      comp.volants.forEach(vl=>{
        const p25=vl.p25||0;
        // Calculer p26 basé sur jours affectés
        const vJours=(S.data.volantJours||[]).filter(vj=>vj.societe===cn&&vj.volant===vl.nom);
        const totalJours=vJours.reduce((s,vj)=>s+vj.jours,0);
        const moisSaisis=vJours.filter((v,i,a)=>a.findIndex(x=>x.mois===v.mois)===i).length;
        const p26=Math.round(p25*totalJours/240); // approximation
        const d=p26-p25;
        const cl=d>0?'var(--red)':d<0?'var(--grn)':'var(--tx3)';
        const ar=d>0?'▲':d<0?'▼':'';
        
        h+=`<tr style="${vl.parti?'opacity:.5;background:#fff8f8':''}">
          <td style="padding:7px 12px 7px 32px;font-size:12px">${vl.nom} <span class="badge-vol">VOLANT</span>${vl.parti?' <span class="badge-parti">PARTI</span>':''}</td>
          <td style="font-size:11px;color:var(--vol)">Multi-magasins</td>
          <td class="r" style="color:var(--tx3)">${fmtE(p25)}</td>
          <td class="r" style="color:var(--tx3)">${moisSaisis}/12</td>
          <td class="r" style="font-weight:800">${vl.parti?'—':fmtE(p26)}</td>
          <td class="r" style="font-weight:600;color:${cl}">${vl.parti?'—':ar+' '+fmtE(Math.abs(d))}</td>
        </tr>`;
      });
    }
    // ═══════════════════════════════════════════════════════════════
    h+=`<tr style="background:#0f172a;color:#fff;font-weight:800">
      <td colspan="2" style="padding:10px 12px 10px 16px">TOTAL ${cn.toUpperCase()}</td>
      <td class="r">${fmtE(sd.total25)}</td><td></td>
      <td class="r" style="font-size:14px">${fmtE(sd.total26)}</td>
      <td class="r" style="color:${ecart>=0?'#f87171':'#86efac'}">${ecart>=0?'▲':'▼'} ${fmtE(Math.abs(ecart))}</td>
    </tr></tbody></table></div>`;
    
    // Ajouter section vendeurs partis
    const comp = S.data.companies[cn];
    if(comp){
      const partisHTML = renderPartisSection(comp);
      if(partisHTML){
        h += partisHTML;
      }
    }
    
    h+='</div>';
  }
  return h;}

// ── Vue mensuelle RH : onglets par société + filtre de recherche ──
function renderRecapMensuel(socData,moisSel,grandMois){
  const socNames=Object.keys(socData);
  const selSoc=S.rhSocTab||'all';
  const srch=(S.recapSearch||'').toLowerCase().trim();

  // Onglets sociétés
  let h=`<div class="rh-tabs">
    <button class="rh-tab ${selSoc==='all'?'all-on':''}" onclick="S.rhSocTab='all';render()">🌐 Toutes</button>
    ${socNames.map(cn=>`<button class="rh-tab ${selSoc===cn?'on':''}" onclick="S.rhSocTab='${esc(cn)}';render()">${cn}</button>`).join('')}
  </div>`;

  // Barre recherche locale RH
  h+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
    <div class="gsearch-wrap" style="max-width:320px">
      <input class="gsearch-input" placeholder="Filtrer vendeur, magasin..." value="${esc(S.recapSearch||'')}"
        oninput="S.recapSearch=this.value;renderRhBody()"/>
    </div>
    ${srch?`<button class="gsearch-clear" onclick="S.recapSearch='';render()">✕ Effacer</button>
    <span class="gsearch-hits">Filtre actif : <b>${srch}</b></span>`:''}
  </div>`;

  // Sociétés à afficher
  const toShow=selSoc==='all'?socNames:[selSoc];

  h+=`<div id="rh-body">${buildRhBody(socData,moisSel,toShow,srch)}</div>`;

  // Grand total mensuel (toujours toutes sociétés)
  h+=`<div style="background:linear-gradient(90deg,#1e3a5f,#1e293b);border-radius:14px;padding:14px 20px;margin-bottom:16px;overflow-x:auto">
    <div style="font-size:11px;font-weight:800;color:#93c5fd;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">GRAND TOTAL MENSUEL — toutes sociétés</div>
    <div style="display:flex;gap:6px;flex-wrap:nowrap;min-width:max-content">
      ${grandMois.map((p,i)=>`<div style="background:${i===moisSel?'#3b82f6':'#ffffff14'};border-radius:10px;padding:8px 12px;text-align:center;min-width:80px;cursor:pointer;border:${i===moisSel?'1px solid #60a5fa':'1px solid transparent'}" onclick="S.recapMois=${i};render()">
        <div style="font-size:9px;font-weight:700;color:${i===moisSel?'#fff':'rgba(255,255,255,.4)'};text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${MS[i]}</div>
        <div style="font-size:14px;font-weight:800;color:${i===moisSel?'#fff':p>0?'#e2e8f0':'rgba(255,255,255,.25)'}">${p>0?fmtE(p):'—'}</div>
      </div>`).join('')}
      <div style="background:#ffffff22;border-radius:10px;padding:8px 14px;text-align:center;min-width:90px;border:1px solid #ffffff33">
        <div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">TOTAL 2026</div>
        <div style="font-size:15px;font-weight:800;color:#fff">${fmtE(grandMois.reduce((s,v)=>s+v,0))}</div>
      </div>
    </div>
  </div>`;

  return h;
}

function buildRhBody(socData,moisSel,toShow,srch){
  let h='';
  for(const cn of toShow){
    const sd=socData[cn];if(!sd)continue;
    const totalMoisSoc=sd.primesParMois[moisSel];

    // Filtrage vendeurs selon recherche
    const magsFiltered=sd.magasins.map(md=>{
      const vActifs=md.vendeurs.filter(v=>!v.parti&&(!srch||v.nom.toLowerCase().includes(srch)||md.nom.toLowerCase().includes(srch)||cn.toLowerCase().includes(srch)));
      const vPartis=md.vendeurs.filter(v=>v.parti&&(!srch||v.nom.toLowerCase().includes(srch)));
      return{...md,vActifs,vPartis,visible:vActifs.length>0||vPartis.length>0};
    }).filter(md=>md.visible);

    if(magsFiltered.length===0){
      h+=`<div style="padding:16px;color:var(--tx3);font-size:13px;text-align:center;background:var(--card);border-radius:12px;margin-bottom:10px">Aucun vendeur trouvé pour « ${srch} » dans ${cn}</div>`;
      continue;}

    h+=`<div class="mag" style="margin-bottom:14px">
      <div class="mag-h" style="background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff">
        <div>
          <div style="font-size:9px;text-transform:uppercase;letter-spacing:2px;opacity:.4;margin-bottom:2px">Fiches de paie — ${M[moisSel]} 2026</div>
          <div style="font-weight:800;font-size:16px">${cn}</div>
          <div style="font-size:10px;opacity:.5;margin-top:2px">👤 ${sd.manager||'—'} · ${sd.nVend} vendeur(s) actif(s)</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div style="background:#3b82f622;border:1px solid #3b82f644;border-radius:10px;padding:8px 14px;text-align:center">
            <div style="font-size:9px;opacity:.6;text-transform:uppercase;letter-spacing:1px">${M[moisSel]} 2026</div>
            <div style="font-size:20px;font-weight:800">${fmtE(totalMoisSoc)}</div>
          </div>
          <div style="background:#ffffff12;border-radius:10px;padding:8px 14px;text-align:center">
            <div style="font-size:9px;opacity:.4;text-transform:uppercase;letter-spacing:1px">Annuel simulé</div>
            <div style="font-size:17px;font-weight:800">${fmtE(sd.total26)}</div>
          </div>
        </div>
      </div>
      <div style="overflow-x:auto"><table class="rtbl">
        <thead><tr style="background:#f8fafc">
          <th style="padding-left:16px;min-width:180px;position:sticky;left:0;background:#f8fafc;z-index:1">Vendeur</th>
          <th style="min-width:130px">Magasin</th>
          ${MS.map((m,i)=>`<th class="r" style="min-width:72px;white-space:nowrap;${i===moisSel?'background:#eff6ff;color:var(--blu);font-weight:800':''}">${m}</th>`).join('')}
          <th class="r" style="min-width:90px;background:#f1f5f9;position:sticky;right:0">Total 2026</th>
        </tr></thead>
        <tbody>`;

    for(const md of magsFiltered){
      const magTot=md.primesParMois.reduce((s,v)=>s+v,0);
      h+=`<tr style="background:#f1f5f9">
        <td colspan="2" style="padding:6px 12px 6px 14px;font-size:12px;font-weight:700">
          🏬 ${md.nom} <span style="font-size:10px;color:var(--tx3);font-weight:400">— 👤 ${md.manager||'—'}</span>
        </td>
        ${md.primesParMois.map((p,i)=>`<td class="r" style="font-size:11px;font-weight:600;${i===moisSel?'background:#eff6ff;color:var(--blu)':''}">${p>0?fmtE(p):'—'}</td>`).join('')}
        <td class="r" style="font-weight:800;background:#f1f5f9">${fmtE(magTot)}</td>
      </tr>`;

      md.vActifs.forEach(v=>{
        const nom=srch?v.nom.replace(new RegExp(srch.replace(/[-[\]/{}()*+?.,\\^$|#\s]/g,'\\$&'),'gi'),m=>`<mark class="gsearch-hit">${m}</mark>`):v.nom;
        h+=`<tr>
          <td style="padding:7px 12px 7px 24px;font-size:12px;font-weight:600;position:sticky;left:0;background:#fff">${nom}</td>
          <td style="font-size:11px;color:var(--tx3)">${md.nom}</td>
          ${v.pm.map((p,i)=>`<td class="r" style="font-size:12px;font-weight:${p>0?'700':'400'};color:${p>0?'var(--grn)':'var(--tx3)'};${i===moisSel?'background:#eff6ff;':''}">${p>0?fmtE(p):'—'}</td>`).join('')}
          <td class="r" style="font-weight:800;background:#f8fafc;position:sticky;right:0">${fmtE(v.p26)}</td>
        </tr>`;
      });

      md.vPartis.forEach(v=>{
        h+=`<tr style="opacity:.35">
          <td style="padding:6px 12px 6px 24px;font-size:12px">${v.nom} <span class="badge-parti">PARTI</span></td>
          <td style="font-size:11px;color:var(--tx3)">${md.nom}</td>
          ${MS.map(()=>'<td class="r" style="color:var(--tx3)">—</td>').join('')}
          <td class="r" style="background:#f8fafc;color:var(--tx3)">—</td>
        </tr>`;
      });
    }
    
    // ══ AJOUTER LES VOLANTS ══════════════════════════════════════════
    const comp=S.data.companies[cn];
    if(comp&&comp.volants&&comp.volants.length>0){
      const volantsActifs=comp.volants.filter(v=>!v.parti&&(!srch||v.nom.toLowerCase().includes(srch)||cn.toLowerCase().includes(srch)));
      const volantsPartis=comp.volants.filter(v=>v.parti&&(!srch||v.nom.toLowerCase().includes(srch)));
      
      if(volantsActifs.length>0||volantsPartis.length>0){
        h+=`<tr style="background:#f5f3ff">
          <td colspan="2" style="padding:6px 12px 6px 14px;font-size:12px;font-weight:700;color:var(--vol)">
            🔄 Vendeurs Volants
          </td>
          ${MS.map((m,i)=>`<td class="r" style="font-size:11px;font-weight:600;${i===moisSel?'background:#eff6ff;color:var(--blu)':''}">—</td>`).join('')}
          <td class="r" style="font-weight:800;background:#f5f3ff">—</td>
        </tr>`;
        
        volantsActifs.forEach(vl=>{
          const nom=srch?vl.nom.replace(new RegExp(srch.replace(/[-[\]/{}()*+?.,\\^$|#\s]/g,'\\$&'),'gi'),m=>`<mark class="gsearch-hit">${m}</mark>`):vl.nom;
          // Calculer les primes mensuelles du volant basées sur jours affectés
          const pm=new Array(12).fill(0);
          let totalVolant=0;
          for(let m=0;m<12;m++){
            const vJours=(S.data.volantJours||[]).filter(vj=>vj.societe===cn&&vj.volant===vl.nom&&vj.mois===m);
            if(vJours.length>0){
              // Prime proportionnelle aux jours affectés (simplifié)
              const totalJours=vJours.reduce((s,vj)=>s+vj.jours,0);
              pm[m]=Math.round((vl.p25||0)*totalJours/240); // approximation 20j/mois * 12
              totalVolant+=pm[m];
            }
          }
          h+=`<tr>
            <td style="padding:7px 12px 7px 24px;font-size:12px;font-weight:600;position:sticky;left:0;background:#fff">${nom} <span class="badge-vol">VOLANT</span></td>
            <td style="font-size:11px;color:var(--vol)">Multi-magasins</td>
            ${pm.map((p,i)=>`<td class="r" style="font-size:12px;font-weight:${p>0?'700':'400'};color:${p>0?'var(--vol)':'var(--tx3)'};${i===moisSel?'background:#eff6ff;':''}">${p>0?fmtE(p):'—'}</td>`).join('')}
            <td class="r" style="font-weight:800;background:#f8fafc;position:sticky;right:0">${fmtE(totalVolant)}</td>
          </tr>`;
        });
        
        volantsPartis.forEach(vl=>{
          h+=`<tr style="opacity:.35">
            <td style="padding:6px 12px 6px 24px;font-size:12px">${vl.nom} <span class="badge-vol">VOLANT</span> <span class="badge-parti">PARTI</span></td>
            <td style="font-size:11px;color:var(--tx3)">Multi-magasins</td>
            ${MS.map(()=>'<td class="r" style="color:var(--tx3)">—</td>').join('')}
            <td class="r" style="background:#f8fafc;color:var(--tx3)">—</td>
          </tr>`;
        });
      }
    }
    // ═══════════════════════════════════════════════════════════════

    h+=`<tr style="background:#0f172a;color:#fff;font-weight:800">
      <td colspan="2" style="padding:10px 12px 10px 14px;font-size:12px">TOTAL ${cn.toUpperCase()}</td>
      ${sd.primesParMois.map((p,i)=>`<td class="r" style="${i===moisSel?'color:#93c5fd;':''}font-size:12px">${p>0?fmtE(p):'—'}</td>`).join('')}
      <td class="r" style="font-size:14px">${fmtE(sd.total26)}</td>
    </tr></tbody></table></div></div>`;}
  return h;
}

// Live update RH body without full re-render
window.renderRhBody=function(){
  const body=document.getElementById('rh-body');if(!body){render();return;}
  // Recompute socData quickly
  const socData={};const grandMois=new Array(12).fill(0);
  for(const[cn,comp]of Object.entries(S.data.companies)){
    const sd={name:cn,manager:comp.manager||'',magasins:[],total25:0,total26:0,primesParMois:new Array(12).fill(0),nVend:0,nParti:0};
    for(const mag of comp.magasins){
      const ca25=mag.totalCA2025||100000;
      const md={nom:mag.nom,manager:mag.manager||comp.manager||'',ca25,vendeurs:[],total25:0,total26:0,primesParMois:new Array(12).fill(0)};
      for(const v of mag.vendeurs){
        let tp=0;const pm=new Array(12).fill(0);
        for(let m=0;m<12;m++){const ca=v.caSaisie?.[m]??v.caSheet?.[m];if(ca==null)continue;
          const obj=v.objManuel?.[m]||v.objSheet?.[m]||calcObj(ca25,comp.augmentation||2,m);
          const pr=calcPrime((ca/obj)*100,comp.paliers||[]);tp+=pr;pm[m]=pr;}
        md.vendeurs.push({nom:v.nom,p25:v.p25||0,p26:tp,pm,months:0,parti:!!v.parti});
        if(!v.parti){md.total26+=tp;for(let m=0;m<12;m++)md.primesParMois[m]+=pm[m];}
        sd.nVend+=(v.parti?0:1);}
      sd.magasins.push(md);}
    
    // ══ AJOUTER LES VOLANTS ══════════════════════════════════════════
    for(const vl of (comp.volants||[])){
      sd.total25+=(vl.p25||0);
      if(!vl.parti){
        const vJours=(S.data.volantJours||[]).filter(vj=>vj.societe===cn&&vj.volant===vl.nom);
        const totalJours=vJours.reduce((s,vj)=>s+vj.jours,0);
        const p26=Math.round((vl.p25||0)*totalJours/240);
        sd.total26+=p26;
      }
    }
    // ═══════════════════════════════════════════════════════════════════
    
    socData[cn]=sd;}
  const moisSel=S.recapMois??0;
  const selSoc=S.rhSocTab||'all';
  const toShow=selSoc==='all'?Object.keys(socData):[selSoc];
  const srch=(S.recapSearch||'').toLowerCase().trim();
  body.innerHTML=buildRhBody(socData,moisSel,toShow,srch);
};

window.saveApiUrl=v=>{API_URL=v.trim();localStorage.setItem('primes_api_url',API_URL);};

window.doLogin=async function(){
  S.password=document.getElementById('pwInput')?.value||'';
  if(!API_URL){S.loginError="Configurez l'URL Apps Script.";render();return;}
  S.loading=true;S.loginError='';render();
  try{const r=await api('check_password');
    if(r.success){S.phase='main';render();const data=await api('get_all_data');
      S.data=data;S.volantJours=data.volantJours||[];S.activeComp=Object.keys(data.companies)[0]||'';S.loading=false;render();}
    else{S.loginError='Mot de passe incorrect';S.loading=false;render();}}
  catch(e){S.loginError='Erreur : '+e.message;S.loading=false;render();}};

window.doLogout=()=>{S.phase='login';S.data=null;S.password='';render();};
window.doRefresh=async()=>{toast('Actualisation...');

window.doExport=()=>{
  const wb=XLSX.utils.book_new();
  for(const[cn,comp]of Object.entries(S.data.companies)){
    const rows=[['Vendeur','Magasin','Type','Manager','Statut','Primes 2025',...M.flatMap(m=>[`Obj ${m}`,`CA ${m}`,`Taux`,`Prime`]),'Total 2026']];
    for(const mag of comp.magasins){const ca25=mag.totalCA2025||100000;const mgr=mag.manager||comp.manager||'';
      for(const v of mag.vendeurs){const row=[v.nom,mag.nom,'FIXE',mgr,v.parti?'PARTI':'Actif',v.p25||0];let tp=0;
        for(let m=0;m<12;m++){const obj=v.objManuel?.[m]||v.objSheet?.[m]||calcObj(ca25,comp.augmentation||2,m);const ca=v.caSaisie?.[m]??v.caSheet?.[m];
          const t=ca!=null?(ca/obj)*100:null;const p=calcPrime(t,comp.paliers||[]);tp+=p;
          row.push(obj,ca,t!=null?Math.round(t*10)/10+'%':'',p||'');}row.push(tp);rows.push(row);}}
    if((comp.volants||[]).length){rows.push([]);rows.push(['— VOLANTS —']);
      for(const v of comp.volants)rows.push([v.nom,'—','VOLANT',comp.manager||'',v.parti?'PARTI':'Actif',v.p25||0]);}
    const ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,cn.substring(0,31));}
  XLSX.writeFile(wb,`Primes_2026_${new Date().toISOString().split('T')[0]}.xlsx`);toast('Export téléchargé');};

render();
